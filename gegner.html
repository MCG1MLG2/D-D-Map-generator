<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="enemyHeading">Gegnertafel-Generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="languages.js"></script>
<style>
  :root{--stone-1:#171310;--stone-2:#241d17;--gold:#b6903f;--gold-bright:#d9b56a;--ink:#2c2013;--parchment:#e7d9b6;--parchment-dark:#d3c092;--parchment-shadow:#8a7142;--crimson:#7c2020;--text-muted:#a8977b;--shadow:rgba(0,0,0,.5)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  @property --bg-base{syntax:'<color>';inherits:true;initial-value:#171310}
  @property --bg-glow-1{syntax:'<color>';inherits:true;initial-value:#3a2c1c}
  @property --bg-glow-2{syntax:'<color>';inherits:true;initial-value:#2a1f14}
  @property --bg-spot{syntax:'<color>';inherits:true;initial-value:rgba(217,181,106,.12)}
  body{transition:--bg-base .5s,--bg-glow-1 .5s,--bg-glow-2 .5s,--bg-spot .5s;
    background:radial-gradient(ellipse at 70% 45%,var(--bg-spot) 0%,transparent 55%),radial-gradient(ellipse at 20% -10%,var(--bg-glow-1) 0%,transparent 55%),radial-gradient(ellipse at 90% 110%,var(--bg-glow-2) 0%,transparent 55%),var(--bg-base);
    color:var(--parchment);font-family:'EB Garamond',serif;min-height:100vh}
  .layout{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}

  .panel{background:linear-gradient(180deg,var(--stone-2),var(--stone-1));border-right:1px solid #000;padding:64px 30px 40px;box-shadow:inset -18px 0 30px -28px #000}
  .panel h1{font-family:'Cinzel Decorative',serif;font-size:1.5rem;color:var(--gold-bright);margin:0 0 4px}
  .panel .sub{color:var(--text-muted);font-size:.95rem;margin:0 0 30px;font-style:italic}
  .field{margin-bottom:20px}
  .field label{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:7px}
  .field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:#0f0c09;border:1px solid #4a3c28;color:var(--parchment);font-family:'EB Garamond',serif;font-size:1.05rem;padding:9px 11px;border-radius:3px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold)}
  .field textarea{resize:vertical;min-height:72px;line-height:1.4}
  .field select option{background:var(--parchment);color:var(--ink)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .hint{font-size:.78rem;color:var(--text-muted);margin:-10px 0 20px;line-height:1.5}
  .swatches{display:flex;flex-wrap:wrap;gap:10px}
  .swatch{width:34px;height:34px;border-radius:50%;border:2px solid #000;cursor:pointer}
  .swatch.active{border-color:var(--parchment);box-shadow:0 0 0 2px var(--gold)}

  .field .toggle-row{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;padding:8px 10px;border-radius:5px;border:1px solid transparent;transition:background .15s,border-color .15s;margin:0}
  .field .toggle-row:hover{background:rgba(182,144,63,.08);border-color:#4a3c28}
  .toggle-row input{display:none}
  .toggle-switch{width:56px;height:32px;background:#0f0c09;border:1px solid #4a3c28;border-radius:16px;position:relative;transition:background .25s,border-color .25s,box-shadow .25s;flex:0 0 auto;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
  .toggle-switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#c9bfa8,#8a7a5c);box-shadow:0 1px 2px rgba(0,0,0,.5);transition:left .25s cubic-bezier(.34,1.56,.64,1),background .25s}
  .toggle-row input:checked+.toggle-switch{background:linear-gradient(180deg,var(--accent,#7c2020),var(--accent-60,#4a1313));border-color:var(--gold-bright);box-shadow:inset 0 1px 3px rgba(0,0,0,.3),0 0 8px var(--accent-55,rgba(124,32,32,.55))}
  .toggle-row input:checked+.toggle-switch::after{left:27px;background:linear-gradient(180deg,#fff6e0,var(--gold-bright))}
  .field .toggle-label{display:inline;font-size:.95rem;text-transform:none;color:var(--parchment);margin:0;letter-spacing:0}
  .btn{display:block;margin-top:8px;width:100%;padding:11px;font-family:'Cinzel',serif;font-weight:600;letter-spacing:.03em;font-size:.88rem;border-radius:4px;cursor:pointer;background:transparent;border:1px solid var(--gold);color:var(--gold-bright)}
  .btn:hover{background:rgba(182,144,63,.12)}
  .btn.main,.btn.active{background:linear-gradient(180deg,var(--gold-bright),var(--gold));border-color:#7a5c22;color:#241a08}
  .btn.main{padding:13px;font-size:.95rem;font-weight:700;margin-top:10px}
  .btn.main:hover{background:linear-gradient(180deg,var(--gold-bright),var(--gold));filter:brightness(1.07)}
  .share-panel{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding:12px;background:rgba(0,0,0,.25);border:1px solid var(--gold);border-radius:4px}
  .share-panel.collapsed{display:none}
  .share-panel .field{margin:0}
  .share-panel .btn{margin:0;background:linear-gradient(180deg,#f3e8c8,#d8c599);border-color:#7a5c22;color:#241a08}
  .share-panel .btn.primary{background:linear-gradient(180deg,var(--gold-bright),var(--gold))}
  .status{font-size:.8rem;color:var(--text-muted);margin-top:8px;min-height:1em}
  .status.ok{color:#7fae6a}

  .stage{display:flex;align-items:center;justify-content:center;padding:50px 30px}
  #card{width:520px;min-height:620px;position:relative;padding:34px 38px 30px;color:var(--ink);border-radius:2px;
    background:linear-gradient(155deg,var(--accent-20,rgba(168,130,58,.2)),transparent 65%),radial-gradient(circle at 15% 10%,rgba(255,255,255,.08),transparent 40%),linear-gradient(155deg,var(--tint-1,#e7d9b6) 0%,var(--tint-2,#ded0a6) 60%,var(--tint-3,#d3c092) 100%);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 10px #17130f,0 0 0 11px #4a3c28}
  #card::before{content:"";position:absolute;inset:10px;border:1px solid var(--parchment-shadow);pointer-events:none}
  #card::after{content:"";position:absolute;inset:15px;border:2px solid var(--accent,#7c2020);opacity:.7;pointer-events:none}
  .seal{position:absolute;top:-20px;right:26px;z-index:5;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-bright,#b34d4d),var(--accent,#7c2020) 70%);border:2px solid #241a08;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 10px rgba(0,0,0,.5)}
  .seal .num{font-family:'Cinzel Decorative',serif;font-size:1.6rem;color:#f3e8c8}
  .seal .cap{position:absolute;bottom:-14px;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
  .header{text-align:center;margin:14px 0 18px}
  .header h2{font-family:'Cinzel',serif;font-weight:900;font-size:2rem;margin:0;color:var(--ink)}
  .epithet{font-style:italic;color:#5a4a30;font-size:1.05rem;margin-top:4px}
  .rule{height:1px;margin:16px auto;width:70%;background:linear-gradient(90deg,transparent,var(--accent,#7c2020),transparent)}
  .medallion-row{display:flex;gap:20px;align-items:flex-start;margin-bottom:18px}
  .medallion{flex:0 0 auto;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6e0,var(--accent,#7c2020) 75%);border:3px solid #241a08;display:flex;align-items:center;justify-content:center;font-size:2.4rem;box-shadow:inset 0 0 12px rgba(0,0,0,.35)}
  .medallion{overflow:hidden}
  .medallion img{width:100%;height:100%;display:block}
  .box{background:rgba(255,255,255,.28);border:1px solid var(--parchment-shadow);border-radius:3px;padding:12px 14px}
  .box.ability{flex:1}
  .box .label,.type-name{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--crimson);margin-bottom:5px}
  .box p{margin:0;font-size:.92rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
  .type-row{display:flex;gap:14px;align-items:center;background:rgba(124,32,32,.06);border:1px solid var(--parchment-shadow);border-radius:3px;padding:10px 14px;margin-bottom:18px}
  .type-icon{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6e0,var(--accent,#7c2020) 75%);border:2px solid #241a08;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
  .type-perk{font-size:.88rem;line-height:1.4}
  .stats{display:flex;gap:14px;margin-bottom:18px}
  .stat{flex:1;text-align:center;background:rgba(255,255,255,.28);border:1px solid var(--parchment-shadow);border-radius:3px;padding:8px 6px}
  .stat b{display:block;font-family:'Cinzel Decorative',serif;font-size:1.5rem;color:var(--ink)}
  .stat span{font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:#5a4a30}
  .track{margin-bottom:16px}
  .track .label{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#5a4a30;margin-bottom:7px}
  .pips{display:grid;grid-template-columns:repeat(15,24px);gap:5px}
  .pip{width:24px;height:24px;border:1.5px solid #5a4a30;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:.68rem;font-weight:600;color:#5a4a30}
  #hpPips .pip{background:rgba(200,60,60,.28)}
  #arPips .pip{background:rgba(90,110,140,.3)}
  #dmgPips .pip{background:rgba(220,150,40,.32)}

  .lang-picker,.back-btn{position:fixed;top:20px;z-index:20;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,var(--parchment),var(--parchment-dark));border:1px solid var(--gold);border-radius:6px;box-shadow:0 6px 16px var(--shadow);font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--ink)}
  .lang-picker{right:20px;padding:8px 12px}
  .lang-picker select{appearance:none;-webkit-appearance:none;background:transparent;border:none;font:inherit;color:var(--ink);padding-right:16px;cursor:pointer}
  .lang-picker select:focus{outline:none}
  .lang-picker select option{background:var(--parchment);color:var(--ink)}
  .lang-picker::after{content:"▾";position:absolute;right:12px;pointer-events:none;color:var(--gold);font-size:11px}
  .back-btn{left:20px;padding:8px 14px;text-decoration:none}
  .back-btn:hover{filter:brightness(1.06)}
  html[dir=rtl] .lang-picker{right:auto;left:20px}
  html[dir=rtl] .back-btn{left:auto;right:20px}
  @media(max-width:480px){.lang-picker{top:12px;right:12px;padding:6px 10px}.back-btn{top:12px;left:12px;padding:6px 10px}html[dir=rtl] .lang-picker{left:12px}html[dir=rtl] .back-btn{right:12px}}
</style>
</head>
<body>
<a href="index.html" class="back-btn"><span aria-hidden="true">←</span> <span data-i18n="backToHome">Start</span></a>
<div class="lang-picker"><span>🌐</span><select id="languageSelect" aria-label="Sprache wählen"></select></div>

<div class="layout">
  <div class="panel">
    <h1 data-i18n="enemyHeading">Gegnertafel-Generator</h1>
    <p class="sub" data-i18n="enemySubtitle">Erschaffe einen Gegner für deine Kampagne</p>

    <button class="btn main" id="randomBtn" style="margin:0 0 24px" data-i18n="enemyRandomBtn">🎲 Zufälliger Gegner</button>

    <div class="field"><label for="eName" data-i18n="enemyLblName">Name des Gegners</label><input type="text" id="eName" value="Gorgash" maxlength="24"></div>
    <div class="field"><label for="eEpi" data-i18n="playerLblEpithet">Beiname / Herkunft</label><input type="text" id="eEpi" value="Schrecken der Sumpfpfade" maxlength="60"></div>
    <div class="field row2">
      <div><label for="eThreat" data-i18n="enemyLblThreat">Gefahrenstufe</label><input type="number" id="eThreat" value="8" min="1" max="150"></div>
      <div><label for="eIcon" data-i18n="playerLblIcon">Symbol (Emoji)</label><input type="text" id="eIcon" value="👹" maxlength="8"></div>
    </div>
    <p class="hint" data-i18n-html="playerHintEmoji">Tipp: Emoji-Tastatur öffnen mit <kbd>⊞ Win</kbd> + <kbd>.</kbd> (Windows) oder <kbd>⌃⌘Space</kbd> (Mac)</p>
    <div class="field">
      <label data-i18n="playerLblPortrait">Bild statt Symbol</label>
      <input type="file" id="eImage" accept="image/*" style="display:none">
      <div class="row2">
        <button class="btn" id="uploadBtn" type="button" style="margin:0" data-i18n="playerUploadBtn">Bild hochladen</button>
        <button class="btn" id="removeImgBtn" type="button" style="margin:0;display:none" data-i18n="playerRemoveImageBtn">Bild entfernen</button>
      </div>
    </div>
    <div class="field"><label for="eType" data-i18n="enemyLblType">Spezies</label><select id="eType"></select></div>
    <div class="field"><label for="ePassive" data-i18n="enemyLblPassive">Passive Fähigkeit</label><select id="ePassive"></select></div>
    <div class="field"><label for="eAbility" data-i18n="enemyLblAbility">Spezialangriff</label><textarea id="eAbility" rows="3">Wirft einmal pro Kampf einen Felsbrocken auf ein Ziel in bis zu 3 Feldern Entfernung.</textarea></div>
    <div class="field row2">
      <div><label for="eHp" data-i18n="enemyLblHp">Lebenspunkte</label><input type="number" id="eHp" value="12" min="1" max="100"></div>
      <div><label for="eArmor" data-i18n="enemyLblArmor">Rüstungspunkte</label><input type="number" id="eArmor" value="3" min="0" max="100"></div>
    </div>
    <div class="field">
      <label for="eDmgMode" data-i18n="enemyLblDamageMode">Schaden-Darstellung</label>
      <select id="eDmgMode">
        <option value="pips" data-i18n="enemyDmgModePips">Kästchen (wie Lebenspunkte)</option>
        <option value="badge" selected data-i18n="enemyDmgModeBadge">Zahl (wie Bewegung)</option>
        <option value="off" data-i18n="enemyDmgModeOff">Nicht anzeigen</option>
      </select>
    </div>
    <div class="field row2">
      <div><label for="eDmg" data-i18n="enemyLblDamage">Schaden</label><input type="number" id="eDmg" value="4" min="0" max="30"></div>
      <div><label for="eMove" data-i18n="enemyLblMove">Bewegung (Felder)</label><input type="number" id="eMove" value="2" min="0" max="20"></div>
    </div>
    <div class="field"><label data-i18n="playerLblAccentColor">Akzentfarbe</label><div class="swatches" id="swatches"></div></div>

    <button class="btn main" id="exportBtn" data-i18n="playerExportBtn">Als PNG speichern</button>
    <button class="btn" id="shareToggleBtn" data-i18n="shareToggleBtn">🔗 Teilen</button>
    <div class="share-panel collapsed" id="sharePanel">
      <button class="btn" id="copyBtn" data-i18n="copySettingsBtn">📋 Kopieren</button>
      <div class="field"><input type="text" id="pasteInput" data-i18n-placeholder="pasteSettingsPrompt" placeholder="Link oder Code hier einfügen:"></div>
      <button class="btn primary" id="applyBtn" data-i18n="applyPasteSettingsBtn">✓ Anwenden</button>
      <span class="status" id="pasteStatus"></span>
    </div>
    <div class="status" id="exportStatus"></div>
  </div>

  <div class="stage">
    <div id="card">
      <div class="seal"><span class="num" id="threatOut">8</span><span class="cap" data-i18n="enemyCapThreat">Gefahr</span></div>
      <div class="header"><h2 id="nameOut"></h2><div class="epithet" id="epiOut"></div></div>
      <div class="rule"></div>
      <div class="medallion-row">
        <div class="medallion" id="medOut">👹</div>
        <div class="box ability" id="abBox"><div class="label" data-i18n="enemyLblAbility">Spezialangriff</div><p id="abOut"></p></div>
      </div>
      <div class="type-row" id="typeRow" style="display:none">
        <div class="type-icon" id="typeIcon"></div>
        <div><div class="type-name" id="typeName"></div><div class="type-perk" id="typePerk"></div></div>
      </div>
      <div class="type-row" id="passiveRow" style="display:none">
        <div class="type-icon" id="passiveIcon"></div>
        <div><div class="type-name" id="passiveName"></div><div class="type-perk" id="passivePerk"></div></div>
      </div>
      <div class="stats" id="stats">
        <div class="stat" id="dmgBox"><b id="dmgOut">0</b><span data-i18n="enemyLblDamage">Schaden</span></div>
        <div class="stat" id="moveBox"><b id="moveOut">0</b><span data-i18n="enemyStatMove">Bewegung</span></div>
      </div>
      <div class="track"><div class="label" data-i18n="enemyLblHp">Lebenspunkte</div><div class="pips" id="hpPips"></div></div>
      <div class="track" id="dmgTrack"><div class="label" data-i18n="enemyLblDamage">Schaden</div><div class="pips" id="dmgPips"></div></div>
      <div class="track" id="arTrack"><div class="label" data-i18n="enemyLblArmor">Rüstungspunkte</div><div class="pips" id="arPips"></div></div>
    </div>
  </div>
</div>

<script>
  // Fehlende Übersetzungen (neue "enemy…"-Keys) fallen auf den deutschen Text im HTML bzw. hier zurück
  const L = (typeof LANGUAGES !== 'undefined') ? LANGUAGES : { en:{} };
  let currentLang = 'en';
  const $ = id => document.getElementById(id);
  function t(k){ const s = L[currentLang] || L.en || {}; return s[k] !== undefined ? s[k] : (L.en || {})[k]; }
  function tt(k, fallback){ const v = t(k); return v !== undefined ? v : fallback; }

  // neue Typen nur ans ENDE anhängen (Position steckt im Teilen-Link)
  const TYPES = [
    { id:'undead',    icon:'🧟', name:'Untoter',   perk:'Steht nach dem ersten Tod einmal mit 1 Lebenspunkt wieder auf.' },
    { id:'beast',     icon:'🐺', name:'Bestie',    perk:'Greift immer das schwächste Ziel in Reichweite an.' },
    { id:'demon',     icon:'😈', name:'Dämon',     perk:'Heilige Angriffe verursachen doppelten Schaden.' },
    { id:'dragon',    icon:'🐉', name:'Drache',    perk:'Einmal pro Kampf trifft sein Feueratem alle Felder in einer Linie.' },
    { id:'goblin',    icon:'👺', name:'Goblin',    perk:'Tritt in Gruppen auf: Jeder weitere Goblin in der Nähe gibt +1 Schaden.' },
    { id:'giant',     icon:'🗿', name:'Riese',     perk:'Kann nicht zurückgedrängt werden und schleudert Gegner 2 Felder weit.' },
    { id:'elemental', icon:'🌪️', name:'Elementar', perk:'Immun gegen nicht-magische Waffen.' },
    { id:'construct', icon:'⚙️', name:'Konstrukt', perk:'Immun gegen Gift und Furcht.' },
    { id:'bandit',    icon:'🗡️', name:'Bandit',    perk:'Flieht, sobald er weniger als die Hälfte seiner Lebenspunkte hat.' }
  ];
  const typeSel = $('eType');
  typeSel.innerHTML = '<option value="" data-i18n="enemyTypeNone">— Keiner —</option>';
  TYPES.forEach(ty => {
    const o = document.createElement('option');
    o.value = ty.id; o.textContent = ty.name; o.setAttribute('data-i18n', 'enemyType_' + ty.id);
    typeSel.appendChild(o);
  });

  // passive Fähigkeiten – nur ans ENDE anhängen (Position steckt im Teilen-Link)
  const PASSIVES = [
    { id:'regen',    icon:'💚', name:'Regeneration',     perk:'Heilt zu Beginn seines Zuges 1 Lebenspunkt.' },
    { id:'thick',    icon:'🛡️', name:'Dicke Haut',       perk:'Jeder erlittene Schaden wird um 1 verringert.' },
    { id:'fear',     icon:'😱', name:'Furchteinflößend', perk:'Gegner direkt neben ihm haben -1 auf ihre Angriffe.' },
    { id:'fly',      icon:'🪽', name:'Flug',             perk:'Ignoriert Hindernisse und Gelände bei der Bewegung.' },
    { id:'thorns',   icon:'☠️', name:'Giftige Haut',     perk:'Wer ihn im Nahkampf trifft, erleidet 1 Schaden.' },
    { id:'pack',     icon:'🐾', name:'Rudeltaktik',      perk:'+1 Schaden, wenn ein Verbündeter neben dem Ziel steht.' },
    { id:'magicres', icon:'✨', name:'Magieresistenz',   perk:'Erleidet nur den halben Schaden durch Zauber.' },
    { id:'berserk',  icon:'💢', name:'Berserker',        perk:'+2 Schaden, solange er weniger als die Hälfte seiner Lebenspunkte hat.' }
  ];
  const passiveSel = $('ePassive');
  passiveSel.innerHTML = '<option value="" data-i18n="enemyPassiveNone">— Keine —</option>';
  PASSIVES.forEach(pa => {
    const o = document.createElement('option');
    o.value = pa.id; o.textContent = pa.name; o.setAttribute('data-i18n', 'enemyPassive_' + pa.id);
    passiveSel.appendChild(o);
  });

  // Reihenfolge = Position im Teilen-Link, nur ans Ende anhängen
  const PALETTE = [
    { name:'Karmesin', key:'playerColorCrimson',  accent:'#7c2020', bright:'#b34d4d' },
    { name:'Gold',     key:'playerColorGold',     accent:'#a8823a', bright:'#d9b56a' },
    { name:'Wald',     key:'playerColorForest',   accent:'#2f4a2b', bright:'#5c8a52' },
    { name:'Azur',     key:'playerColorAzure',    accent:'#2a4a66', bright:'#5c8fb3' },
    { name:'Purpur',   key:'playerColorPurple',   accent:'#4a2a5c', bright:'#7d5399' },
    { name:'Orange',   key:'playerColorOrange',   accent:'#a8501c', bright:'#e08a4a' },
    { name:'Türkis',   key:'playerColorTeal',     accent:'#1f6b6b', bright:'#4fb3b0' },
    { name:'Silber',   key:'playerColorSilver',   accent:'#6b7078', bright:'#b8bec8' },
    { name:'Oliv',     key:'playerColorOlive',    accent:'#5c6023', bright:'#9aa04a' },
    { name:'Obsidian', key:'playerColorObsidian', accent:'#2b2b33', bright:'#6a6a78' },
    { name:'Weinrot',  key:'playerColorWine',     accent:'#5e1a2f', bright:'#a8475f' },
    { name:'Smaragd',  key:'playerColorEmerald',  accent:'#1d5c45', bright:'#3fae83' }
  ];
  let sel = PALETTE[0];
  PALETTE.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'swatch' + (i === 0 ? ' active' : ''); d.dataset.idx = i; d.title = p.name;
    d.style.background = `radial-gradient(circle at 35% 30%, ${p.bright}, ${p.accent} 75%)`;
    d.addEventListener('click', () => { selectColor(i); render(); });
    $('swatches').appendChild(d);
  });
  function selectColor(i){
    if(!PALETTE[i]) return;
    sel = PALETTE[i];
    document.querySelectorAll('.swatch').forEach(el => el.classList.toggle('active', +el.dataset.idx === i));
  }

  // Mischfarben in JS (kein CSS color-mix(), das kann html2canvas 1.4.1 nicht lesen)
  const rgb = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
  const mix = (a, b, r) => { const x = rgb(a), y = rgb(b); return 'rgb(' + x.map((v, i) => Math.round(v*r + y[i]*(1-r))).join(',') + ')'; };
  const alpha = (h, a) => 'rgba(' + rgb(h).join(',') + ',' + a + ')';

  function pips(el, count, min, max = 100){
    el.innerHTML = '';
    const n = Math.max(min, Math.min(max, parseInt(count, 10) || min));
    for(let i = 0; i < n; i++){ const p = document.createElement('div'); p.className = 'pip'; p.textContent = i + 1; el.appendChild(p); }
  }

  function render(){
    $('nameOut').textContent = $('eName').value || tt('enemyNameless', 'Namenloser Gegner');
    $('epiOut').textContent = $('eEpi').value;
    $('threatOut').textContent = Math.max(1, Math.min(150, parseInt($('eThreat').value, 10) || 1));
    const med = $('medOut'); med.textContent = '';
    if(portrait){ const im = new Image(); im.src = portrait; med.appendChild(im); } else med.textContent = $('eIcon').value || '👹';
    $('removeImgBtn').style.display = portrait ? '' : 'none';
    const ab = $('eAbility').value.trim();
    $('abOut').textContent = ab; $('abBox').style.display = ab ? '' : 'none';

    const ty = TYPES.find(x => x.id === $('eType').value);
    $('typeRow').style.display = ty ? 'flex' : 'none';
    if(ty){
      $('typeIcon').textContent = ty.icon;
      $('typeName').textContent = tt('enemyType_' + ty.id, ty.name);
      $('typePerk').textContent = tt('enemyPerk_' + ty.id, ty.perk);
    }

    const pa = PASSIVES.find(x => x.id === $('ePassive').value);
    $('passiveRow').style.display = pa ? 'flex' : 'none';
    if(pa){
      $('passiveIcon').textContent = pa.icon;
      $('passiveName').textContent = tt('enemyPassive_' + pa.id, pa.name);
      $('passivePerk').textContent = tt('enemyPassivePerk_' + pa.id, pa.perk);
    }

    const dmg = Math.max(0, parseInt($('eDmg').value, 10) || 0), mv = Math.max(0, parseInt($('eMove').value, 10) || 0);
    const mode = $('eDmgMode').value, asBadge = mode === 'badge' && dmg > 0, asPips = mode === 'pips' && dmg > 0;
    $('moveOut').textContent = mv; $('dmgOut').textContent = dmg;
    $('moveBox').style.display = mv ? '' : 'none';
    $('dmgBox').style.display = asBadge ? '' : 'none';
    $('stats').style.display = (mv || asBadge) ? '' : 'none';
    $('dmgTrack').style.display = asPips ? '' : 'none';
    if(asPips) pips($('dmgPips'), dmg, 1, 30);

    pips($('hpPips'), $('eHp').value, 1);
    const ar = parseInt($('eArmor').value, 10) || 0;
    $('arTrack').style.display = ar > 0 ? '' : 'none';
    if(ar > 0) pips($('arPips'), ar, 1);

    const c = $('card'), a = sel.accent, b = sel.bright, dark = '#0a0806';
    c.style.setProperty('--accent', a); c.style.setProperty('--accent-bright', b);
    c.style.setProperty('--accent-20', alpha(a, .2));
    c.style.setProperty('--tint-1', mix(a, '#e7d9b6', .14));
    c.style.setProperty('--tint-2', mix(a, '#ded0a6', .16));
    c.style.setProperty('--tint-3', mix(a, '#d3c092', .18));
    const s = document.body.style;
    s.setProperty('--accent', a); s.setProperty('--accent-60', mix(a, '#000000', .6)); s.setProperty('--accent-55', alpha(a, .55));
    s.setProperty('--bg-base', mix(a, dark, .10)); s.setProperty('--bg-glow-1', mix(b, dark, .22));
    s.setProperty('--bg-glow-2', mix(a, dark, .20)); s.setProperty('--bg-spot', alpha(b, .12));
  }
  document.querySelectorAll('.panel input, .panel textarea, .panel select').forEach(el => {
    el.addEventListener('input', render); el.addEventListener('change', render);
  });

  // ---------- Bild-Upload (quadratisch zugeschnitten, 300 px) ----------
  let portrait = null;
  $('uploadBtn').addEventListener('click', () => $('eImage').click());
  $('removeImgBtn').addEventListener('click', () => { portrait = null; $('eImage').value = ''; render(); });
  $('eImage').addEventListener('change', function(){
    const f = this.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = 300;
        const side = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 300, 300);
        portrait = c.toDataURL('image/jpeg', 0.88); render();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });

  // ---------- Zufallsgenerator ----------
  const R = a => a[Math.floor(Math.random() * a.length)];
  const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const NAME_A = ['Gor','Vel','Mor','Kra','Zul','Brak','Nar','Skar','Thu','Grim','Ur','Dras'];
  const NAME_B = ['gash','dun','thrax','mok','gul','rax','nir','zar','bok','vul','dor','ruk'];
  const EPI_KEYS = Array.from({length: 10}, (_, i) => 'enemyEpithet_' + (i + 1));
  const ABI_KEYS = Array.from({length: 8}, (_, i) => 'enemyAbility_' + (i + 1));
  const R_KEY = keys => t(R(keys)) || t(keys[0]) || '';
  // Standardtexte der Vorschau folgen der Sprache, solange sie unverändert (in irgendeiner Sprache) im Feld stehen
  function isDefaultText(val, key){ return Object.keys(L).some(c => L[c][key] === val); }
  function refreshDefaults(){
    if(isDefaultText($('eEpi').value, 'enemyEpithet_1')) $('eEpi').value = t('enemyEpithet_1') || $('eEpi').value;
    if(isDefaultText($('eAbility').value, 'enemyAbility_1')) $('eAbility').value = t('enemyAbility_1') || $('eAbility').value;
  }
  $('randomBtn').addEventListener('click', () => {
    const ty = R(TYPES), thr = rnd(1, 30);
    $('eName').value = R(NAME_A) + R(NAME_B).replace(/^./, m => m);
    $('eEpi').value = R_KEY(EPI_KEYS);
    $('eThreat').value = thr; $('eIcon').value = ty.icon; $('eType').value = ty.id; $('ePassive').value = Math.random() < 0.75 ? R(PASSIVES).id : '';
    $('eAbility').value = R_KEY(ABI_KEYS);
    $('eHp').value = Math.min(100, 4 + Math.round(thr * 0.8) + rnd(0, 3));
    $('eArmor').value = Math.min(100, Math.floor(thr / 4) + rnd(0, 1));
    $('eDmg').value = Math.max(1, Math.round(thr / 2) + rnd(0, 2));
    $('eMove').value = rnd(1, 4);
    selectColor(rnd(0, PALETTE.length - 1));
    portrait = null; $('eImage').value = '';
    render();
  });

  // ---------- PNG-Export ----------
  $('exportBtn').addEventListener('click', () => {
    const st = $('exportStatus');
    st.textContent = tt('playerExportCreating', 'Erstelle Bild …');
    html2canvas($('card'), { scale: 2, backgroundColor: null }).then(canvas => {
      const a = document.createElement('a');
      a.download = 'Gegnertafel_' + ($('eName').value || 'gegner').trim().replace(/\s+/g, '_') + '.png';
      a.href = canvas.toDataURL('image/png'); a.click();
      st.textContent = tt('playerExportSaved', 'Gespeichert!');
      setTimeout(() => st.textContent = '', 2500);
    }).catch(err => { console.error('PNG export failed:', err); st.textContent = tt('playerExportError', 'Export fehlgeschlagen'); });
  });

  // ---------- Teilen per Link (#g=<base64 JSON>) ----------
  function collect(){
    return { v:1, l:currentLang, n:$('eName').value, e:$('eEpi').value, r:$('eThreat').value, i:$('eIcon').value,
      t:TYPES.findIndex(x => x.id === $('eType').value), p:PASSIVES.findIndex(x => x.id === $('ePassive').value), a:$('eAbility').value, hp:$('eHp').value, ar:$('eArmor').value,
      d:$('eDmg').value, sd:$('eDmgMode').value, m:$('eMove').value, ac:PALETTE.indexOf(sel) };
  }
  function shareURL(){
    return location.origin + location.pathname + location.search + '#g=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(collect())))));
  }
  function applyShared(code){
    const m = code.trim().match(/[#&]g=([^&]+)/);
    const raw = m ? decodeURIComponent(m[1]) : code.trim();
    const s = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if(s.v !== 1) throw new Error('invalid');
    $('eName').value = s.n; $('eEpi').value = s.e; $('eThreat').value = s.r; $('eIcon').value = s.i;
    $('eType').value = s.t >= 0 && TYPES[s.t] ? TYPES[s.t].id : '';
    $('ePassive').value = s.p >= 0 && PASSIVES[s.p] ? PASSIVES[s.p].id : '';
    $('eAbility').value = s.a; $('eHp').value = s.hp; $('eArmor').value = s.ar; $('eDmg').value = s.d; $('eDmgMode').value = s.sd === false ? 'off' : (s.sd === 'badge' || s.sd === 'off' ? s.sd : 'pips'); $('eMove').value = s.m;
    selectColor(s.ac);
    portrait = null; $('eImage').value = '';
    if(s.l && L[s.l]) applyLanguage(s.l); else render();
  }
  $('shareToggleBtn').addEventListener('click', function(){
    const p = $('sharePanel'), show = p.classList.contains('collapsed');
    p.classList.toggle('collapsed'); this.classList.toggle('active', show);
    $('pasteStatus').textContent = ''; if(show){ $('pasteInput').value = ''; $('pasteInput').focus(); }
  });
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => false);
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); return Promise.resolve(ok);
  }
  $('copyBtn').addEventListener('click', function(){
    const btn = this, old = btn.textContent;
    copyText(shareURL()).then(ok => { btn.textContent = ok ? tt('settingsCopied', 'Kopiert!') : tt('settingsCopyError', 'Kopieren fehlgeschlagen'); setTimeout(() => btn.textContent = old, 1800); });
  });
  function applyPasted(){
    const code = $('pasteInput').value.trim(), st = $('pasteStatus');
    if(!code) return;
    try{ applyShared(code); st.textContent = tt('settingsCopied', 'Kopiert!'); st.className = 'status ok'; $('pasteInput').value = ''; }
    catch(e){ st.textContent = tt('pasteSettingsError', 'Ungültiger Code'); st.className = 'status'; }
  }
  $('applyBtn').addEventListener('click', applyPasted);
  $('pasteInput').addEventListener('keydown', e => { if(e.key === 'Enter') applyPasted(); });

  // ---------- Sprache ----------
  function applyLanguage(lang){
    currentLang = L[lang] ? lang : 'en';
    const s = L[currentLang] || {}, en = L.en || {};
    const get = k => s[k] !== undefined ? s[k] : en[k];
    document.documentElement.lang = currentLang;
    document.documentElement.dir = s.dir || 'ltr';
    [['data-i18n', (el, v) => el.textContent = v], ['data-i18n-html', (el, v) => el.innerHTML = v],
     ['data-i18n-placeholder', (el, v) => el.placeholder = v]].forEach(([attr, fn]) => {
      document.querySelectorAll('[' + attr + ']').forEach(el => { const v = get(el.getAttribute(attr)); if(v !== undefined) fn(el, v); });
    });
    document.querySelectorAll('.swatch').forEach(el => { const v = get(PALETTE[+el.dataset.idx].key); if(v !== undefined) el.title = v; });
    const h = get('enemyHeading'); if(h) document.title = h;
    $('languageSelect').value = currentLang;
    refreshDefaults();
    render();
  }
  Object.keys(L).forEach(code => {
    const o = document.createElement('option'); o.value = code; o.textContent = L[code].nativeName || code; $('languageSelect').appendChild(o);
  });
  $('languageSelect').addEventListener('change', function(){ applyLanguage(this.value); });
  function detectLanguage(){
    for(const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'])){
      const c = l.toLowerCase().split('-')[0]; if(L[c]) return c;
    }
    return 'en';
  }

  let restored = false;
  if(location.hash.indexOf('g=') !== -1){ try{ applyShared(location.hash); restored = true; }catch(e){} }
  if(!restored) applyLanguage(detectLanguage());
</script>
</body>
</html>
