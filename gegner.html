<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="enemyHeading">Gegnertafel-Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="languages.js"></script>
<style>
  :root{--stone-1:#171310;--stone-2:#241d17;--gold:#b6903f;--gold-bright:#d9b56a;--ink:#2c2013;--parchment:#e7d9b6;--parchment-dark:#d3c092;--parchment-shadow:#8a7142;--crimson:#7c2020;--text-muted:#a8977b;--shadow:rgba(0,0,0,.5)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  @property --bg-base{syntax:'<color>';inherits:true;initial-value:#171310}
  @property --bg-glow-1{syntax:'<color>';inherits:true;initial-value:#3a2c1c}
  @property --bg-glow-2{syntax:'<color>';inherits:true;initial-value:#2a1f14}
  @property --bg-spot{syntax:'<color>';inherits:true;initial-value:rgba(217,181,106,.12)}
  body{transition:--bg-base .5s,--bg-glow-1 .5s,--bg-glow-2 .5s,--bg-spot .5s;
    background:radial-gradient(ellipse at 70% 45%,var(--bg-spot) 0%,transparent 55%),radial-gradient(ellipse at 20% -10%,var(--bg-glow-1) 0%,transparent 55%),radial-gradient(ellipse at 90% 110%,var(--bg-glow-2) 0%,transparent 55%),var(--bg-base);
    color:var(--parchment);font-family:'EB Garamond',serif;min-height:100vh}
  .layout{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}

  .panel{background:linear-gradient(180deg,var(--stone-2),var(--stone-1));border-right:1px solid #000;padding:64px 30px 40px;box-shadow:inset -18px 0 30px -28px #000}
  .panel h1{font-family:'Cinzel Decorative',serif;font-size:1.5rem;color:var(--gold-bright);margin:0 0 4px}
  .panel .sub{color:var(--text-muted);font-size:.95rem;margin:0 0 30px;font-style:italic}
  .field{margin-bottom:20px}
  .field label{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:7px}
  .field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:#0f0c09;border:1px solid #4a3c28;color:var(--parchment);font-family:'EB Garamond',serif;font-size:1.05rem;padding:9px 11px;border-radius:3px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold)}
  .field textarea{resize:vertical;min-height:72px;line-height:1.4}
  .field select option{background:var(--parchment);color:var(--ink)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .hint{font-size:.78rem;color:var(--text-muted);margin:-10px 0 20px;line-height:1.5}
  .swatches{display:flex;flex-wrap:wrap;gap:10px}
  .swatch{width:34px;height:34px;border-radius:50%;border:2px solid #000;cursor:pointer}
  .swatch.active{border-color:var(--parchment);box-shadow:0 0 0 2px var(--gold)}

  .field .toggle-row{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;padding:8px 10px;border-radius:5px;border:1px solid transparent;transition:background .15s,border-color .15s;margin:0}
  .field .toggle-row:hover{background:rgba(182,144,63,.08);border-color:#4a3c28}
  .toggle-row input{display:none}
  .toggle-switch{width:56px;height:32px;background:#0f0c09;border:1px solid #4a3c28;border-radius:16px;position:relative;transition:background .25s,border-color .25s,box-shadow .25s;flex:0 0 auto;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
  .toggle-switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#c9bfa8,#8a7a5c);box-shadow:0 1px 2px rgba(0,0,0,.5);transition:left .25s cubic-bezier(.34,1.56,.64,1),background .25s}
  .toggle-row input:checked+.toggle-switch{background:linear-gradient(180deg,var(--accent,#7c2020),var(--accent-60,#4a1313));border-color:var(--gold-bright);box-shadow:inset 0 1px 3px rgba(0,0,0,.3),0 0 8px var(--accent-55,rgba(124,32,32,.55))}
  .toggle-row input:checked+.toggle-switch::after{left:27px;background:linear-gradient(180deg,#fff6e0,var(--gold-bright))}
  .field .toggle-label{display:inline;font-size:.95rem;text-transform:none;color:var(--parchment);margin:0;letter-spacing:0}
  .btn{display:block;margin-top:8px;width:100%;padding:11px;font-family:'Cinzel',serif;font-weight:600;letter-spacing:.03em;font-size:.88rem;border-radius:4px;cursor:pointer;background:transparent;border:1px solid var(--gold);color:var(--gold-bright)}
