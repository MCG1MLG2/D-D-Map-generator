<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartenwerkstatt</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=MedievalSharp&display=swap" rel="stylesheet">

<style>
  :root{
    --parchment: #ead9b4;
    --parchment-dark: #d9c393;
    --ink: #3b2a1a;
    --ink-soft: #5c4630;
    --gold: #a9782f;
    --gold-light: #c9a14a;
    --shadow: rgba(59,42,26,0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Cinzel', serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;

    background-color: #7a5c33;
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.08), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(0,0,0,0.25), transparent 60%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 6px);
  }

  /* Sprachauswahl oben rechts */
  .lang-picker {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 8px 12px;
    box-shadow: 0 6px 16px var(--shadow);
  }

  .lang-picker .globe {
    font-size: 16px;
    line-height: 1;
  }

  .lang-picker select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: none;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    padding-right: 16px;
    cursor: pointer;
  }

  .lang-picker select:focus {
    outline: none;
  }

  .lang-picker::after {
    content: "▾";
    position: absolute;
    right: 12px;
    pointer-events: none;
    color: var(--gold);
    font-size: 11px;
  }

  .board {
    position: relative;
    width: 100%;
    max-width: 640px;
    padding: 56px 40px 48px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.15), transparent 55%),
      linear-gradient(160deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    border-radius: 6px;
    box-shadow:
      0 25px 60px var(--shadow),
      0 0 0 1px rgba(0,0,0,0.15) inset;
    text-align: center;
    overflow: hidden;
  }

  .board::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(rgba(59,42,26,0.06) 1px, transparent 1px),
      radial-gradient(rgba(59,42,26,0.05) 1px, transparent 1px);
    background-size: 60px 60px, 37px 37px;
    background-position: 0 0, 18px 22px;
    pointer-events: none;
    mix-blend-mode: multiply;
  }

  .frame {
    position: absolute;
    inset: 12px;
    border: 2px solid var(--gold);
    border-radius: 3px;
    pointer-events: none;
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid var(--gold-light);
    border-radius: 2px;
  }

  .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--gold);
  }
  .corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
  .corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
  .corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

  .compass {
    font-size: 34px;
    margin-bottom: 6px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(28px, 5vw, 42px);
    margin: 0 0 6px;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    letter-spacing: 1px;
  }

  .subtitle {
    font-family: 'MedievalSharp', cursive;
    font-size: 18px;
    color: var(--ink-soft);
    margin: 0 0 30px;
  }

  .divider {
    width: 140px;
    height: 14px;
    margin: 0 auto 30px;
    position: relative;
  }
  .divider::before,
  .divider::after {
    content: "";
    position: absolute;
    top: 6px;
    width: 55px;
    height: 2px;
    background: var(--gold);
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }
  .divider .diamond {
    position: absolute;
    left: 50%;
    top: 1px;
    width: 10px;
    height: 10px;
    background: var(--gold);
    transform: translateX(-50%) rotate(45deg);
  }

  p.desc {
    font-family: 'Cinzel', serif;
    color: var(--ink-soft);
    max-width: 440px;
    margin: 0 auto 38px;
    line-height: 1.6;
    font-size: 15px;
  }

  .button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 36px;
    background: linear-gradient(180deg, #8a5a24, #6b4419);
    color: #f3e6c8;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 1px solid var(--gold-light);
    border-radius: 4px;
    box-shadow:
      0 6px 0 #4a2f10,
      0 10px 18px rgba(0,0,0,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }

  .button:hover {
    transform: translateY(-2px);
    background: linear-gradient(180deg, #9c6a2c, #7a4e1e);
    box-shadow:
      0 8px 0 #4a2f10,
      0 14px 22px rgba(0,0,0,0.4);
  }

  .button:active {
    transform: translateY(3px);
    box-shadow:
      0 3px 0 #4a2f10,
      0 6px 10px rgba(0,0,0,0.35);
  }

  footer {
    margin-top: 34px;
    font-family: 'MedievalSharp', cursive;
    font-size: 13px;
    color: var(--ink-soft);
    opacity: 0.75;
  }

  /* RTL-Anpassung für Arabisch, Urdu, Persisch */
  html[dir="rtl"] .lang-picker {
    right: auto;
    left: 20px;
  }

  @media (max-width: 480px) {
    .lang-picker {
      top: 12px;
      right: 12px;
      padding: 6px 10px;
    }
    html[dir="rtl"] .lang-picker {
      left: 12px;
    }
    .board {
      padding: 70px 24px 36px;
    }
  }
</style>
</head>

<body>

  <div class="lang-picker">
    <span class="globe">🌐</span>
    <select id="langSelect" aria-label="Sprache wählen"></select>
  </div>

  <div class="board">
    <div class="frame"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="compass">🧭</div>
    <h1 data-i18n="heading">D&amp;D Helper</h1>
    <p class="subtitle" data-i18n="indexSubtitle">Deine Reise beginnt mit einer Karte</p>

    <div class="divider"><span class="diamond"></span></div>

    <p class="desc" data-i18n="description">
      Erschaffe deine eigene Fantasiewelt — mit Bergen, Wäldern, Flüssen
      und Siedlungen. Jede Karte ist einzigartig, reproduzierbar und
      bereit für dein nächstes Abenteuer.
    </p>

    <a href="map.html" class="button">
      <span>🗺️</span> <span data-i18n="buttonText">Zur Karte</span>
    </a>

    <footer><span data-i18n="footer">Kartenwerkstatt</span></footer>
  </div>

  <script src="languages.js"></script>
  <script>
    (function () {
      var STORAGE_KEY = 'kartenwerkstatt_lang';
      var select = document.getElementById('langSelect');

      function populateSelector() {
        var codes = Object.keys(LANGUAGES).sort(function (a, b) {
          return LANGUAGES[a].nativeName.localeCompare(LANGUAGES[b].nativeName, 'en');
        });
        codes.forEach(function (code) {
          var opt = document.createElement('option');
          opt.value = code;
          opt.textContent = LANGUAGES[code].nativeName;
          select.appendChild(opt);
        });
      }

      function detectLanguage() {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved && LANGUAGES[saved]) return saved;

        var browserLangs = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language || 'en'];

        for (var i = 0; i < browserLangs.length; i++) {
          var code = browserLangs[i].toLowerCase();
          if (LANGUAGES[code]) return code;
          var base = code.split('-')[0];
          if (LANGUAGES[base]) return base;
        }
        return 'en';
      }

      function applyLanguage(code) {
        var t = LANGUAGES[code] || LANGUAGES.en;
        document.documentElement.lang = code;
        document.documentElement.dir = t.dir || 'ltr';
        document.title = t.pageTitle;

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var key = el.getAttribute('data-i18n');
          if (t[key]) el.textContent = t[key];
        });

        select.value = code;
        localStorage.setItem(STORAGE_KEY, code);
      }

      populateSelector();
      applyLanguage(detectLanguage());

      select.addEventListener('change', function (e) {
        applyLanguage(e.target.value);
      });
    })();
  </script>

</body>
</html>
