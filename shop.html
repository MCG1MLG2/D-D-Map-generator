<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="shopHeading">Shop-Generator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='30'%20fill='%23ead9b4'%20stroke='%23a9782f'%20stroke-width='4'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='24'%20fill='none'%20stroke='%23c9a14a'%20stroke-width='1.2'/%3E%3Cpath%20d='M8%2032h7M49%2032h7M32%208v0'%20stroke='%233b2a1a'%20stroke-width='2.5'%20stroke-linecap='round'/%3E%3Cpath%20d='M32%209L39%2032H25Z'%20fill='%238b2a1f'/%3E%3Cpath%20d='M32%2055L39%2032H25Z'%20fill='%233b2a1a'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='3.2'%20fill='%23c9a14a'%20stroke='%233b2a1a'%20stroke-width='1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="languages.js"></script>
<style>
  :root{
    --stone-1:#171310;
    --stone-2:#241d17;
    --stone-3:#332821;
    --gold:#b6903f;
    --gold-bright:#d9b56a;
    --gold-light:#d9b56a;
    --ink:#2c2013;
    --parchment:#e7d9b6;
    --parchment-dark:#d3c092;
    --parchment-edge:#c7ac77;
    --parchment-shadow:#8a7142;
    --crimson:#7c2020;
    --text-muted:#a8977b;
    --shadow:rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* page background follows the chosen accent colour (set from render()); registered so it fades smoothly */
  @property --bg-base   { syntax:'<color>'; inherits:true; initial-value:#171310; }
  @property --bg-glow-1 { syntax:'<color>'; inherits:true; initial-value:#3a2c1c; }
  @property --bg-glow-2 { syntax:'<color>'; inherits:true; initial-value:#2a1f14; }
  @property --bg-spot   { syntax:'<color>'; inherits:true; initial-value:rgba(217,181,106,.12); }
  body{
    transition:--bg-base .5s ease, --bg-glow-1 .5s ease, --bg-glow-2 .5s ease, --bg-spot .5s ease;
    background:
      radial-gradient(ellipse at 70% 45%, var(--bg-spot) 0%, transparent 55%),
      radial-gradient(ellipse at 20% -10%, var(--bg-glow-1) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, var(--bg-glow-2) 0%, transparent 55%),
      var(--bg-base);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    min-height:100vh;
  }

  .layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:0;
    min-height:100vh;
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---------- Left: control panel ---------- */
  .panel{
    background:linear-gradient(180deg, var(--stone-2), var(--stone-1));
    border-right:1px solid #000;
    padding:64px 30px 40px;
    box-shadow:inset -18px 0 30px -28px #000;
  }
  .panel h1{
    font-family:'Cinzel Decorative', serif;
    font-size:1.5rem;
    color:var(--gold-bright);
    margin:0 0 4px;
    letter-spacing:.02em;
  }
  .panel .sub{
    color:var(--text-muted);
    font-size:.95rem;
    margin:0 0 30px;
    font-style:italic;
  }
  .field{margin-bottom:20px;}
  .field label{
    display:block;
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--gold);
    margin-bottom:7px;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field textarea,
  .field select{
    width:100%;
    background:#0f0c09;
    border:1px solid #4a3c28;
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    font-size:1.05rem;
    padding:9px 11px;
    border-radius:3px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-color:var(--gold);
  }
  .field textarea{resize:vertical; min-height:72px; line-height:1.4;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  .toolbar{
    display:flex;
    gap:6px;
    margin-bottom:6px;
  }
  .toolbar button{
    width:32px; height:30px;
    background:#0f0c09;
    border:1px solid #4a3c28;
    color:var(--parchment);
    border-radius:3px;
    cursor:pointer;
    font-family:'EB Garamond', serif;
    font-size:.95rem;
    line-height:1;
  }
  .toolbar button:hover{border-color:var(--gold);}
  .toolbar button.b{font-weight:700;}
  .toolbar button.i{font-style:italic;}
  .toolbar button.u{text-decoration:underline;}

  .rich-editable{
    width:100%;
    min-height:72px;
    background:#0f0c09;
    border:1px solid #4a3c28;
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    font-size:1.05rem;
    line-height:1.4;
    padding:9px 11px;
    border-radius:3px;
    overflow-y:auto;
  }
  .rich-editable:focus{outline:none; border-color:var(--gold);}

  .swatches{display:flex; flex-wrap:wrap; gap:10px;}
  .swatch{
    width:34px; height:34px; border-radius:50%;
    border:2px solid #000;
    cursor:pointer;
    position:relative;
  }
  .swatch.active{border-color:var(--parchment); box-shadow:0 0 0 2px var(--gold);}

  .hint{
    font-size:.78rem;
    color:var(--text-muted);
    margin:-10px 0 20px;
    line-height:1.5;
  }
  .hint kbd{
    background:#0f0c09;
    border:1px solid #4a3c28;
    border-radius:3px;
    padding:1px 5px;
    font-family:inherit;
    font-size:.85em;
  }

  .export-btn{
    margin-top:10px;
    width:100%;
    padding:13px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border:1px solid #7a5c22;
    color:#241a08;
    font-family:'Cinzel', serif;
    font-weight:700;
    letter-spacing:.03em;
    font-size:.95rem;
    border-radius:4px;
    cursor:pointer;
  }
  .export-btn:hover{filter:brightness(1.07);}
  .share-btn{
    margin-top:8px;
    width:100%;
    padding:11px;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-bright);
    font-family:'Cinzel', serif;
    font-weight:600;
    letter-spacing:.03em;
    font-size:.88rem;
    border-radius:4px;
    cursor:pointer;
  }
  .share-btn:hover{background:rgba(182,144,63,.12);}
  .share-btn.active{
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#241a08;
  }

  .export-status{font-size:.8rem; color:var(--text-muted); margin-top:8px; min-height:1em;}
  /* ---------- Right: preview stage ---------- */
  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:50px 30px;
  }
  /* On desktop the stage stays as tall as the window and sticks while the left panel scrolls,
     so the card is always centered in the visible area. If the card is taller than the window,
     the stage scrolls itself (margin:auto keeps the top reachable). */
  @media (min-width:901px){
    .stage{
      position:sticky;
      top:0;
      align-self:start;
      height:100vh;
      box-sizing:border-box;
      overflow:auto;
    }
    .stage > #card{ margin:auto; flex:none; }
  }

  #card{
    width:520px;
    min-height:720px;
    background:
      linear-gradient(155deg, var(--accent-mix-20-transparent, rgba(168,130,58,.2)), transparent 65%),
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.08), transparent 40%),
      linear-gradient(155deg, var(--card-tint-1, var(--parchment)) 0%, var(--card-tint-2, #ded0a6) 60%, var(--card-tint-3, #d3c092) 100%);
    border-radius:2px;
    position:relative;
    padding:34px 38px 30px;
    color:var(--ink);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 10px #17130f, 0 0 0 11px #4a3c28;
  }
  #card::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid var(--parchment-shadow);
    pointer-events:none;
  }
  #card::after{
    content:"";
    position:absolute; inset:15px;
    border:2px solid var(--accent, #a8823a);
    opacity:.7;
    pointer-events:none;
  }

  .seal{
    position:absolute; top:-20px; right:26px;
    z-index:5;
    width:64px; height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent-bright,#d9b56a), var(--accent,#a8823a) 70%);
    border:2px solid #241a08;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 10px rgba(0,0,0,.5);
  }
  .seal .num{
    font-family:'Cinzel Decorative', serif;
    font-size:1.6rem;
    color:#241a08;
  }
  .seal .cap{
    position:absolute; bottom:-14px;
    font-size:.6rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--text-muted);
  }

  .header{
    text-align:center;
    margin-top:14px;
    margin-bottom:18px;
  }
  .header h2{
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:2rem;
    margin:0;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .header .epithet{
    font-style:italic;
    color:#5a4a30;
    font-size:1.05rem;
    margin-top:4px;
  }
  .rule{
    height:1px;
    margin:16px auto;
    width:70%;
    background:linear-gradient(90deg, transparent, var(--accent,#a8823a), transparent);
  }

  .medallion-row{
    display:flex;
    gap:20px;
    align-items:flex-start;
    margin-bottom:18px;
  }
  .medallion{
    flex:0 0 auto;
    width:96px; height:96px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6e0, var(--accent,#a8823a) 75%);
    border:3px solid #241a08;
    display:flex; align-items:center; justify-content:center;
    font-size:2.4rem;
    box-shadow:inset 0 0 12px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .medallion img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:50%;
  }
    .ability-box{
    flex:1;
    background:rgba(255,255,255,.28);
    border:1px solid var(--parchment-shadow);
    border-radius:3px;
    padding:12px 14px;
    position:relative;
  }
  .ability-box .label{
    font-family:'Cinzel', serif;
    font-size:.68rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--crimson);
    margin-bottom:5px;
  }
  .ability-box p{
    margin:0;
    font-size:.92rem;
    line-height:1.45;
    color:var(--ink);
  }

  .story-box{
    background:rgba(255,255,255,.28);
    border:1px solid var(--parchment-shadow);
    border-radius:3px;
    padding:12px 14px;
    margin-bottom:18px;
  }
  .story-box .label{
    font-family:'Cinzel', serif;
    font-size:.68rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--crimson);
    margin-bottom:5px;
  }
  .story-box p{
    margin:0;
    font-size:.88rem;
    line-height:1.5;
    color:var(--ink);
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }

  .field .toggle-row{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    user-select:none;
    padding:8px 10px;
    border-radius:5px;
    border:1px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .field .toggle-row:hover{
    background:rgba(182,144,63,.08);
    border-color:#4a3c28;
  }
  .toggle-row input{ display:none; }
  .toggle-switch{
    width:56px; height:32px;
    background:#0f0c09;
    border:1px solid #4a3c28;
    border-radius:16px;
    position:relative;
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
    flex:0 0 auto;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.6);
  }
  .toggle-switch::after{
    content:"";
    position:absolute;
    top:3px; left:3px;
    width:24px; height:24px;
    border-radius:50%;
    background:linear-gradient(180deg,#c9bfa8,#8a7a5c);
    box-shadow:0 1px 2px rgba(0,0,0,.5);
    transition:left .25s cubic-bezier(.34,1.56,.64,1), background .25s ease;
  }
  .toggle-row input:checked + .toggle-switch{
    background:linear-gradient(180deg, var(--accent, #a8823a), var(--accent-mix-60-black, #654e23));
    border-color:var(--gold-bright);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.3), 0 0 8px var(--accent-mix-55-transparent, rgba(168,130,58,.55));
  }
  .toggle-row input:checked + .toggle-switch::after{
    left:27px;
    background:linear-gradient(180deg,#fff6e0, var(--gold-bright));
  }
  .toggle-row:active .toggle-switch::after{ width:27px; }
  .field .toggle-label{ display:inline; font-size:.95rem; text-transform:none; color:var(--parchment); margin-bottom:0; }

  .footer-row{
    display:flex;
    align-items:flex-start;
    gap:20px;
    justify-content:flex-start;
    margin-top:22px;
    padding-top:14px;
    border-top:1px dashed var(--parchment-shadow);
  }
  .brand{
    font-family:'Cinzel', serif;
    font-size:.7rem;
    letter-spacing:.1em;
    color:var(--text-muted-2, #8a7142);
    text-transform:uppercase;
  }

  /* Sprachauswahl oben rechts */
  .lang-picker {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 8px 12px;
    box-shadow: 0 6px 16px var(--shadow);
  }

  .lang-picker .globe {
    font-size: 16px;
    line-height: 1;
  }

  .lang-picker select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: none;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    padding-right: 16px;
    cursor: pointer;
  }

  .lang-picker select:focus {
    outline: none;
  }

  .lang-picker select option {
    background: var(--parchment);
    color: var(--ink);
  }

  .lang-picker::after {
    content: "▾";
    position: absolute;
    right: 12px;
    pointer-events: none;
    color: var(--gold);
    font-size: 11px;
  }

  .back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 8px 14px;
    box-shadow: 0 6px 16px var(--shadow);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
  }
  .back-btn:hover { filter: brightness(1.06); }

  /* RTL-Anpassung für Arabisch, Urdu, Persisch */
  html[dir="rtl"] .lang-picker {
    right: auto;
    left: 20px;
  }
  html[dir="rtl"] .back-btn {
    left: auto;
    right: 20px;
  }

  @media (max-width: 480px) {
    .lang-picker {
      top: 12px;
      right: 12px;
      padding: 6px 10px;
    }
    html[dir="rtl"] .lang-picker {
      left: 12px;
    }
    .back-btn {
      top: 12px;
      left: 12px;
      padding: 6px 10px;
    }
    html[dir="rtl"] .back-btn {
      left: auto;
      right: 12px;
    }
  }

  .irow{display:grid;grid-template-columns:1fr 50px 58px 38px 30px 26px;gap:5px;margin-bottom:6px;}
  .irow input,.irow select{width:100%;min-width:0;background:#0f0c09;border:1px solid #4a3c28;color:var(--parchment);font-family:'EB Garamond',serif;font-size:.95rem;padding:6px;border-radius:3px;}
  .irow input:focus,.irow select:focus{outline:none;border-color:var(--gold);}
  .irow button{background:#0f0c09;border:1px solid #4a3c28;color:var(--parchment);border-radius:3px;cursor:pointer;}
  .irow button:hover{border-color:var(--crimson);color:#d98a8a;}
  .irow-head{display:grid;grid-template-columns:1fr 50px 58px 38px 30px 26px;gap:5px;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-bottom:4px;}
  .equip-group-title{font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-bright);border-top:1px solid var(--gold);padding-top:14px;margin:6px 0 12px;}
  #card{min-height:560px;}
  .seal .num{font-size:1.5rem;}
  .ability-box .label,.story-box .label{margin-bottom:6px;}
  .wares{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .wares li{display:flex;align-items:center;gap:12px;padding:6px 10px 6px 6px;background:var(--slot-bg,rgba(230,190,90,.35));border:2px solid var(--slot-border,#8a7142);border-radius:8px;color:var(--ink);}
  .irow select{padding:6px 2px;}
  .wares .nm{flex:1;min-width:0;font-size:1.08rem;font-weight:600;overflow-wrap:anywhere;}
  .wares .pr{flex:none;font-family:'Cinzel',serif;font-weight:700;font-size:.95rem;color:var(--crimson);}
  .wares li.empty{justify-content:center;font-style:italic;color:#5a4a30;background:none;border-style:dashed;padding:12px;}
  .equip-shape{position:relative;display:flex;align-items:center;justify-content:center;flex:none;width:56px;height:56px;background:var(--slot-bg-strong,rgba(230,190,90,.5));border:2px solid var(--slot-border,#8a7142);}
  .equip-shape svg{width:86%;height:auto;display:block;}
  .equip-shape.belt{width:90px;height:28px;border-radius:5px;}
  .equip-shape.circle{border-radius:50%;}
  .equip-shape.square{border-radius:6px;}

function hexToRgb(hex){const m=hex.replace('#','').match(/.{1,2}/g);return{r:parseInt(m[0],16),g:parseInt(m[1],16),b:parseInt(m[2],16)};}
function mixHex(a,b,ra){const x=hexToRgb(a),y=hexToRgb(b);return 'rgb('+Math.round(x.r*ra+y.r*(1-ra))+','+Math.round(x.g*ra+y.g*(1-ra))+','+Math.round(x.b*ra+y.b*(1-ra))+')';}
function mixWithAlpha(hex,al){const c=hexToRgb(hex);return 'rgba('+c.r+','+c.g+','+c.b+','+al+')';}

function hueKey(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0;
  if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
  const sat=d?d/(1-Math.abs(2*l-1)):0;return{h,l,neutral:sat<0.2};
}

}
const iconMenu=$('iconMenu');let menuRow=null,menuAt=0;
function closeIconMenu(){iconMenu.classList.remove('open');menuRow=null;}
function openIconMenu(r){
  if(menuRow===r&&iconMenu.classList.contains('open')){closeIconMenu();return;}
  menuRow=r;iconMenu.innerHTML='';
  ICON_IDS.forEach(id=>{const ic=ICONS[id],b=document.createElement('button');b.type='button';b.innerHTML=ic.svg;b.title=t(ic.key,ic.de);
    if(r.dataset.icon===id)b.classList.add('on');
    b.onclick=e=>{e.stopPropagation();setIcon(r,id);closeIconMenu();render();};iconMenu.appendChild(b);});
  iconMenu.classList.add('open');menuAt=Date.now();
  const br=r.querySelector('.sh').getBoundingClientRect(),w=iconMenu.offsetWidth,h=iconMenu.offsetHeight;
  iconMenu.style.left=Math.max(8,Math.min(br.right-w,window.innerWidth-w-8))+'px';
  iconMenu.style.top=(br.bottom+window.innerHeight-8>h+br.bottom?br.bottom+4:Math.max(8,br.top-h-4))+'px';
}
document.addEventListener('click',e=>{if(!iconMenu.contains(e.target))closeIconMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeIconMenu();});
window.addEventListener('scroll',()=>{if(Date.now()-menuAt>300)closeIconMenu();},true);
function itemsOf(sec){return sec.querySelector('.items');}
function nextIcon(box){
  const used=[...box.querySelectorAll('.irow')].map(r=>r.dataset.icon);
  return ICON_IDS.find(i=>!used.includes(i))||ICON_IDS[box.children.length%ICON_IDS.length];
}
function addRow(box,name,price,cur,qty,icon){
  if(box.children.length>=MAXITEMS)return;
  const r=document.createElement('div');r.className='irow';
  r.innerHTML='<input type="text" class="in" maxlength="32"><input type="number" class="ip" min="0" max="99999"><select class="ic"></select><input type="number" class="iq" min="0" max="99"><button type="button" class="sh"></button><button type="button" class="rm">✕</button>';
  CUR.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c;r.querySelector('.ic').appendChild(o);});
  r.querySelector('.in').value=name||'';r.querySelector('.ip').value=price===undefined?'':price;
  r.querySelector('.ic').value=cur||0;r.querySelector('.iq').value=qty===undefined?'':qty;
  setIcon(r,icon||nextIcon(box));
  r.querySelector('.sh').onclick=e=>{e.stopPropagation();openIconMenu(r);};
  r.querySelector('.rm').onclick=()=>{r.remove();render();};
  r.addEventListener('input',render);r.addEventListener('change',render);
  box.appendChild(r);
}
function fillExamples(sec){
  const box=itemsOf(sec);box.innerHTML='';
  const ty=TYPES[Number($('sType').value)||0];
  ty.items.forEach((it,i)=>addRow(box,t('shopItem_'+ty.id+'_'+i,it[0]),it[1],it[2],it[3],it[4]||ICON_IDS[i%ICON_IDS.length]));
  render();
}
const SECTPL='<div class="sec-head"><span class="sec-n" role="button" tabindex="0" aria-expanded="true"></span><button type="button" class="sec-rm">✕</button></div>'
 +'<div class="field"><label data-i18n="shopLblSecTitle">Titel (optional)</label><input type="text" class="stitle" maxlength="30"></div>'
 +'<div class="field"><label data-i18n="shopLblMode">Anzeige</label><select class="smode"><option value="stand" data-i18n="shopModeStand">Rüstungsständer</option><option value="shelf" data-i18n="shopModeShelf">Regal</option><option value="list" data-i18n="shopModeList">Liste</option></select></div>'
 +'<div class="irow-head"><span data-i18n="shopColItem">Ware</span><span data-i18n="shopColPrice">Preis</span><span data-i18n="shopColCur">Münze</span><span data-i18n="shopColQty">Anz.</span><span data-i18n="shopColIcon">Symbol</span><span></span></div>'
 +'<div class="items"></div>'
 +'<button type="button" class="share-btn add" data-i18n="shopAddItem">+ Ware hinzufügen</button>'
 +'<button type="button" class="share-btn fill" data-i18n="shopFillItems">🎲 Beispielwaren der Ladenart einsetzen</button>';
function renumber(){
  [...secBox.children].forEach((sec,i)=>{const ti=sec.querySelector('.stitle').value.trim();sec.querySelector('.sec-n').textContent=t('shopSectionN','Auslage')+' '+(i+1)+(ti?' – '+ti:'');});
}
function addSection(mode){
  if(secBox.children.length>=MAXSEC)return null;
  const sec=document.createElement('div');sec.className='sec';sec.innerHTML=SECTPL;
  sec.querySelector('.smode').value=mode||'stand';
  sec.querySelector('.add').onclick=()=>{addRow(itemsOf(sec),'','',0,'');render();};
  sec.querySelector('.fill').onclick=()=>fillExamples(sec);
  sec.querySelector('.sec-rm').onclick=()=>{if(secBox.children.length<=1)return;sec.remove();renumber();render();};
  sec.querySelector('.smode').addEventListener('change',render);
  const sn=sec.querySelector('.sec-n');
  const tg=()=>{const c=sec.classList.toggle('collapsed');sn.setAttribute('aria-expanded',String(!c));};
  sn.addEventListener('click',tg);
  sn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg();}});
  sec.querySelector('.stitle').addEventListener('input',render);
  secBox.appendChild(sec);translate(sec);renumber();
  return sec;
}
function render(){
  renumber();
  const ty=TYPES[Number($('sType').value)||0];
  const P=selectedPalette,card=$('card'),bd='#0a0806',bs=document.body.style;
  card.style.setProperty('--accent',P.accent);card.style.setProperty('--accent-bright',P.bright);
  bs.setProperty('--accent',P.accent);bs.setProperty('--accent-bright',P.bright);
  bs.setProperty('--bg-base',mixHex(P.accent,bd,0.10));
  bs.setProperty('--bg-glow-1',mixHex(P.bright,bd,0.22));
  bs.setProperty('--bg-glow-2',mixHex(P.accent,bd,0.20));
  bs.setProperty('--bg-spot',mixWithAlpha(P.bright,0.12));
  // keine color-mix()-Werte, html2canvas kann sie nicht lesen
  card.style.setProperty('--accent-mix-20-transparent',mixWithAlpha(P.accent,0.2));
  card.style.setProperty('--accent-mix-60-black',mixHex(P.accent,'#000000',0.6));
  card.style.setProperty('--accent-mix-55-transparent',mixWithAlpha(P.accent,0.55));
  card.style.setProperty('--slot-bg',mixWithAlpha(P.bright,0.35));
  card.style.setProperty('--slot-bg-strong',mixWithAlpha(P.bright,0.5));
  card.style.setProperty('--slot-border',mixHex(P.accent,'#8a7142',0.45));
  card.style.setProperty('--card-tint-1',mixHex(P.accent,'#e7d9b6',0.14));
  card.style.setProperty('--card-tint-2',mixHex(P.accent,'#ded0a6',0.16));
  card.style.setProperty('--card-tint-3',mixHex(P.accent,'#d3c092',0.18));
  document.documentElement.style.setProperty('--accent',P.accent);

  $('medallionOut').textContent=ty.icon;
  $('nameOut').textContent=$('sName').value||t('shopDefaultName','Mein Laden');
  const k=$('sKeeper').value.trim();
  $('keeperOut').textContent=k?t('shopKeeperPrefix','Händler:')+' '+k:'';
  $('typeOut').textContent=t('shopType_'+ty.id,ty.de);
  $('descOut').textContent=$('sDesc').value;
  const showQty=$('sQty').checked,out=$('waresOut');out.innerHTML='';
  const price=w=>w.p===''?'–':w.p+' '+w.c;
  const span=(c,tx)=>{const e=document.createElement('span');e.className=c;e.textContent=tx;return e;};
  const box=w=>{const d=document.createElement('div');d.className='equip-shape '+ICONS[w.ic].shape;d.innerHTML=ICONS[w.ic].svg;
    if(showQty&&w.q!=='')d.appendChild(span('qb','×'+w.q));return d;};
  const emptyList=()=>{const ul=document.createElement('ul');ul.className='wares';const e=document.createElement('li');e.className='empty';
    e.textContent=t('shopEmpty','Keine Waren im Angebot.');ul.appendChild(e);return ul;};
  const secs=[...secBox.children];const side=$('sSide').checked;out.classList.toggle('side',side);
  secs.forEach(sec=>{
    const mode=sec.querySelector('.smode').value,title=sec.querySelector('.stitle').value.trim();
    const wares=[];
    itemsOf(sec).querySelectorAll('.irow').forEach(r=>{const nm=r.querySelector('.in').value.trim();if(!nm)return;
      wares.push({nm,p:r.querySelector('.ip').value,q:r.querySelector('.iq').value,c:CUR[Number(r.querySelector('.ic').value)||0],ic:r.dataset.icon||'chest'});});
    if(!wares.length&&secs.length>1)return;
    const wrap=document.createElement('div');wrap.className='sect';
    if(title){const h=document.createElement('div');h.className='sect-title';h.textContent=title;wrap.appendChild(h);}
    if(!wares.length){wrap.appendChild(emptyList());}
    else if(mode==='list'){
      const ul=document.createElement('ul');ul.className='wares';
      wares.forEach(w=>{const li=document.createElement('li');li.appendChild(box(w));li.appendChild(span('nm',w.nm));li.appendChild(span('pr',price(w)));ul.appendChild(li);});
      wrap.appendChild(ul);
    }else{
      if(mode==='stand'){
        const row=document.createElement('div');row.className='equip-row';row.innerHTML=DOLL;const seen={};
        wares.forEach(w=>{if(seen[w.ic])return;seen[w.ic]=1;const sl=document.createElement('div');sl.className='equip-slot '+w.ic;sl.appendChild(box(w));row.appendChild(sl);});
        wrap.appendChild(row);
      }else{
        const sh=document.createElement('div');sh.className='shelf';
        const avail=side?262:398;let cur=null,used=0;
        wares.forEach(w=>{const wd=ICONS[w.ic].shape==='belt'?90:56;
          if(!cur||used+wd+10>avail){cur=document.createElement('div');cur.className='shelf-row';sh.appendChild(cur);used=0;}
          cur.appendChild(box(w));used+=wd+10;});
        wrap.appendChild(sh);
      }
      const lg=document.createElement('ul');lg.className='legend';
      wares.forEach(w=>{const li=document.createElement('li');const mi=document.createElement('span');mi.className='mi';mi.innerHTML=ICONS[w.ic].svg;li.appendChild(mi);
        li.appendChild(span('nm',w.nm));if(showQty&&w.q!=='')li.appendChild(span('qt','×'+w.q));li.appendChild(span('dots',''));li.appendChild(span('pr',price(w)));lg.appendChild(li);});
      wrap.appendChild(lg);
    }
    out.appendChild(wrap);
  });
  if(!out.children.length)out.appendChild(emptyList());
  const cols=side?Math.min(out.children.length,3):1;
  card.style.width=cols>1?(cols*280+(cols-1)*18+120)+'px':'';
  const nv=$('sNum').value.trim()||'–';$('sealNum').textContent=nv;$('sealNum').style.fontSize=nv.length>2?'1.1rem':'1.5rem';
  $('footOut').textContent=t('shopFoot','1 GM = 10 SM = 100 KM');
}
function translate(root){
  const s=LANGUAGES[currentLang]||{};
  root.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');const val=s[key]!==undefined?s[key]:(LANGUAGES.en||{})[key];
    if(val!==undefined)el.textContent=val;});
}
function applyLanguage(lang){
  currentLang=LANGUAGES[lang]?lang:(LANGUAGES.en?'en':'de');
  const s=LANGUAGES[currentLang]||{};
  document.documentElement.lang=currentLang;document.documentElement.dir=s.dir||'ltr';
  translate(document);
  document.querySelectorAll('#swatches .swatch').forEach(el=>{
    const key=PALETTE[Number(el.dataset.idx)].key;const val=s[key]!==undefined?s[key]:(LANGUAGES.en||{})[key];
    if(val!==undefined)el.title=val;});
  document.querySelectorAll('.irow').forEach(r=>setIcon(r,r.dataset.icon));renumber();
  document.title=t('shopHeading','Shop-Generator');
  const sel=$('languageSelect');if(sel.options.length)sel.value=currentLang;
  fillTypes();render();
}
function detectLanguage(){
  const sup=Object.keys(LANGUAGES);
  const bl=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];
  for(const l of bl){const c=l.toLowerCase().split('-')[0];if(sup.includes(c))return c;}
  return LANGUAGES.en?'en':'de';
}
const sel=$('languageSelect');
Object.keys(LANGUAGES).forEach(code=>{const o=document.createElement('option');o.value=code;o.textContent=LANGUAGES[code].nativeName||code;sel.appendChild(o);});
sel.addEventListener('change',function(){applyLanguage(this.value);});
['sName','sKeeper','sDesc','sNum'].forEach(id=>$(id).addEventListener('input',render));
$('sType').addEventListener('change',render);$('sQty').addEventListener('change',render);$('sSide').addEventListener('change',render);
$('addSection').onclick=()=>{const sec=addSection('stand');if(sec){addRow(itemsOf(sec),'','',0,'');render();}};
$('exportBtn').onclick=function(){
  const st=$('exportStatus');
  if(typeof html2canvas==='undefined'){console.error('html2canvas fehlt');return;}
  html2canvas($('card'),{backgroundColor:null,scale:2,useCORS:true}).then(cv=>{
    const a=document.createElement('a');
    a.download=(($('sName').value||'shop').replace(/[^\w\-]+/g,'_'))+'.png';
    a.href=cv.toDataURL('image/png');a.click();st.textContent='';
  }).catch(e=>{console.error(e);});
};
fillTypes();fillExamples(addSection('stand'));applyLanguage(detectLanguage());
})();
</script>
</body>
</html>
