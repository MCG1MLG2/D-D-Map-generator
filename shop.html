<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="shopHeading">Shop-Generator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='30'%20fill='%23ead9b4'%20stroke='%23a9782f'%20stroke-width='4'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='24'%20fill='none'%20stroke='%23c9a14a'%20stroke-width='1.2'/%3E%3Cpath%20d='M8%2032h7M49%2032h7M32%208v0'%20stroke='%233b2a1a'%20stroke-width='2.5'%20stroke-linecap='round'/%3E%3Cpath%20d='M32%209L39%2032H25Z'%20fill='%238b2a1f'/%3E%3Cpath%20d='M32%2055L39%2032H25Z'%20fill='%233b2a1a'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='3.2'%20fill='%23c9a14a'%20stroke='%233b2a1a'%20stroke-width='1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="languages.js"></script>
<style>
  :root{
    --stone-1:#171310;
    --stone-2:#241d17;
    --stone-3:#332821;
    --gold:#b6903f;
    --gold-bright:#d9b56a;
    --gold-light:#d9b56a;
    --ink:#2c2013;
    --parchment:#e7d9b6;
    --parchment-dark:#d3c092;
    --parchment-edge:#c7ac77;
    --parchment-shadow:#8a7142;
    --crimson:#7c2020;
    --text-muted:#a8977b;
    --shadow:rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* page background follows the chosen accent colour (set from render()); registered so it fades smoothly */
  @property --bg-base   { syntax:'<color>'; inherits:true; initial-value:#171310; }
  @property --bg-glow-1 { syntax:'<color>'; inherits:true; initial-value:#3a2c1c; }
  @property --bg-glow-2 { syntax:'<color>'; inherits:true; initial-value:#2a1f14; }
  @property --bg-spot   { syntax:'<color>'; inherits:true; initial-value:rgba(217,181,106,.12); }
  body{
    transition:--bg-base .5s ease, --bg-glow-1 .5s ease, --bg-glow-2 .5s ease, --bg-spot .5s ease;
    background:
      radial-gradient(ellipse at 70% 45%, var(--bg-spot) 0%, transparent 55%),
      radial-gradient(ellipse at 20% -10%, var(--bg-glow-1) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, var(--bg-glow-2) 0%, transparent 55%),
      var(--bg-base);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    min-height:100vh;
  }

  .layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:0;
    min-height:100vh;
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---------- Left: control panel ---------- */
  .panel{
    background:linear-gradient(180deg, var(--stone-2), var(--stone-1));
    border-right:1px solid #000;
    padding:64px 30px 40px;
    box-shadow:inset -18px 0 30px -28px #000;
  }
  .panel h1{
    font-family:'Cinzel Decorative', serif;
    font-size:1.5rem;
    color:var(--gold-bright);
    margin:0 0 4px;
    letter-spacing:.02em;
  }
  .panel .sub{
    color:var(--text-muted);
    font-size:.95rem;
    margin:0 0 30px;
    font-style:italic;
  }
  .field{margin-bottom:20px;}
  .field label{
    display:block;
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--gold);
    margin-bottom:7px;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field textarea,
  .field select{
    width:100%;
    background:#0f0c09;
    border:1px solid #4a3c28;
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    font-size:1.05rem;
    padding:9px 11px;
    border-radius:3px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-color:var(--gold);
  }
  .field textarea{resize:vertical; min-height:72px; line-height:1.4;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  .toolbar{
    display:flex;
    gap:6px;
    margin-bottom:6px;
  }
  .toolbar button{
    width:32px; height:30px;
    background:#0f0c09;
    border:1px solid #4a3c28;
    color:var(--parchment);
    border-radius:3px;
    cursor:pointer;
    font-family:'EB Garamond', serif;
    font-size:.95rem;
    line-height:1;
  }
  .toolbar button:hover{border-color:var(--gold);}
  .toolbar button.b{font-weight:700;}
  .toolbar button.i{font-style:italic;}
  .toolbar button.u{text-decoration:underline;}

  .rich-editable{
    width:100%;
    min-height:72px;
    background:#0f0c09;
    border:1px solid #4a3c28;
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    font-size:1.05rem;
    line-height:1.4;
    padding:9px 11px;
    border-radius:3px;
    overflow-y:auto;
  }
  .rich-editable:focus{outline:none; border-color:var(--gold);}

  .swatches{display:flex; flex-wrap:wrap; gap:10px;}
  .swatch{
    width:34px; height:34px; border-radius:50%;
    border:2px solid #000;
    cursor:pointer;
    position:relative;
  }
  .swatch.active{border-color:var(--parchment); box-shadow:0 0 0 2px var(--gold);}

  .hint{
    font-size:.78rem;
    color:var(--text-muted);
    margin:-10px 0 20px;
    line-height:1.5;
  }
  .hint kbd{
    background:#0f0c09;
    border:1px solid #4a3c28;
    border-radius:3px;
    padding:1px 5px;
    font-family:inherit;
    font-size:.85em;
  }

  .export-btn{
    margin-top:10px;
    width:100%;
    padding:13px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border:1px solid #7a5c22;
    color:#241a08;
    font-family:'Cinzel', serif;
    font-weight:700;
    letter-spacing:.03em;
    font-size:.95rem;
    border-radius:4px;
    cursor:pointer;
  }
  .export-btn:hover{filter:brightness(1.07);}
  .share-btn{
    margin-top:8px;
    width:100%;
    padding:11px;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-bright);
    font-family:'Cinzel', serif;
    font-weight:600;
    letter-spacing:.03em;
    font-size:.88rem;
    border-radius:4px;
    cursor:pointer;
  }
  .share-btn:hover{background:rgba(182,144,63,.12);}
  .share-btn.active{
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#241a08;
  }

  .export-status{font-size:.8rem; color:var(--text-muted); margin-top:8px; min-height:1em;}
  /* ---------- Right: preview stage ---------- */
  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:50px 30px;
  }
  /* On desktop the stage stays as tall as the window and sticks while the left panel scrolls,
     so the card is always centered in the visible area. If the card is taller than the window,
     the stage scrolls itself (margin:auto keeps the top reachable). */
  @media (min-width:901px){
    .stage{
      position:sticky;
      top:0;
      align-self:start;
      height:100vh;
      box-sizing:border-box;
      overflow:auto;
    }
    .stage > #card{ margin:auto; flex:none; }
  }

  #card{
    width:520px;
    min-height:720px;
    background:
      linear-gradient(155deg, var(--accent-mix-20-transparent, rgba(168,130,58,.2)), transparent 65%),
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.08), transparent 40%),
      linear-gradient(155deg, var(--card-tint-1, var(--parchment)) 0%, var(--card-tint-2, #ded0a6) 60%, var(--card-tint-3, #d3c092) 100%);
    border-radius:2px;
    position:relative;
    padding:34px 38px 30px;
    color:var(--ink);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 10px #17130f, 0 0 0 11px #4a3c28;
  }
  #card::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid var(--parchment-shadow);
    pointer-events:none;
  }
  #card::after{
    content:"";
    position:absolute; inset:15px;
    border:2px solid var(--accent, #a8823a);
    opacity:.7;
    pointer-events:none;
  }

  .seal{
    position:absolute; top:-20px; right:26px;
    z-index:5;
    width:64px; height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent-bright,#d9b56a), var(--accent,#a8823a) 70%);
    border:2px solid #241a08;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 10px rgba(0,0,0,.5);
  }
  .seal .num{
    font-family:'Cinzel Decorative', serif;
    font-size:1.6rem;
    color:#241a08;
  }
  .seal .cap{
    position:absolute; bottom:-14px;
    font-size:.6rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--text-muted);
  }

  .header{
    text-align:center;
    margin-top:14px;
    margin-bottom:18px;
  }
  .header h2{
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:2rem;
    margin:0;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .header .epithet{
    font-style:italic;
    color:#5a4a30;
    font-size:1.05rem;
    margin-top:4px;
  }
  .rule{
    height:1px;
    margin:16px auto;
    width:70%;
    background:linear-gradient(90deg, transparent, var(--accent,#a8823a), transparent);
  }

  .medallion-row{
    display:flex;
    gap:20px;
    align-items:flex-start;
    margin-bottom:18px;
  }
  .medallion{
    flex:0 0 auto;
    width:96px; height:96px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6e0, var(--accent,#a8823a) 75%);
    border:3px solid #241a08;
    display:flex; align-items:center; justify-content:center;
    font-size:2.4rem;
    box-shadow:inset 0 0 12px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .medallion img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:50%;
  }
    .ability-box{
    flex:1;
    background:rgba(255,255,255,.28);
    border:1px solid var(--parchment-shadow);
    border-radius:3px;
    padding:12px 14px;
    position:relative;
  }
  .ability-box .label{
    font-family:'Cinzel', serif;
    font-size:.68rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--crimson);
    margin-bottom:5px;
  }
  .ability-box p{
    margin:0;
    font-size:.92rem;
    line-height:1.45;
    color:var(--ink);
  }

  .story-box{
    background:rgba(255,255,255,.28);
    border:1px solid var(--parchment-shadow);
    border-radius:3px;
    padding:12px 14px;
    margin-bottom:18px;
  }
  .story-box .label{
    font-family:'Cinzel', serif;
    font-size:.68rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--crimson);
    margin-bottom:5px;
  }
  .story-box p{
    margin:0;
    font-size:.88rem;
    line-height:1.5;
    color:var(--ink);
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }

  .field .toggle-row{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    user-select:none;
    padding:8px 10px;
    border-radius:5px;
    border:1px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .field .toggle-row:hover{
    background:rgba(182,144,63,.08);
    border-color:#4a3c28;
  }
  .toggle-row input{ display:none; }
  .toggle-switch{
    width:56px; height:32px;
    background:#0f0c09;
    border:1px solid #4a3c28;
    border-radius:16px;
    position:relative;
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
    flex:0 0 auto;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.6);
  }
  .toggle-switch::after{
    content:"";
    position:absolute;
    top:3px; left:3px;
    width:24px; height:24px;
    border-radius:50%;
    background:linear-gradient(180deg,#c9bfa8,#8a7a5c);
    box-shadow:0 1px 2px rgba(0,0,0,.5);
    transition:left .25s cubic-bezier(.34,1.56,.64,1), background .25s ease;
  }
  .toggle-row input:checked + .toggle-switch{
    background:linear-gradient(180deg, var(--accent, #a8823a), var(--accent-mix-60-black, #654e23));
    border-color:var(--gold-bright);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.3), 0 0 8px var(--accent-mix-55-transparent, rgba(168,130,58,.55));
  }
  .toggle-row input:checked + .toggle-switch::after{
    left:27px;
    background:linear-gradient(180deg,#fff6e0, var(--gold-bright));
  }
  .toggle-row:active .toggle-switch::after{ width:27px; }
  .field .toggle-label{ display:inline; font-size:.95rem; text-transform:none; color:var(--parchment); margin-bottom:0; }

  .footer-row{
    display:flex;
    align-items:flex-start;
    gap:20px;
    justify-content:flex-start;
    margin-top:22px;
    padding-top:14px;
    border-top:1px dashed var(--parchment-shadow);
  }
  .brand{
    font-family:'Cinzel', serif;
    font-size:.7rem;
    letter-spacing:.1em;
    color:var(--text-muted-2, #8a7142);
    text-transform:uppercase;
  }

  /* Sprachauswahl oben rechts */
  .lang-picker {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 8px 12px;
    box-shadow: 0 6px 16px var(--shadow);
  }

  .lang-picker .globe {
    font-size: 16px;
    line-height: 1;
  }

  .lang-picker select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: none;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    padding-right: 16px;
    cursor: pointer;
  }

  .lang-picker select:focus {
    outline: none;
  }

  .lang-picker select option {
    background: var(--parchment);
    color: var(--ink);
  }

  .lang-picker::after {
    content: "▾";
    position: absolute;
    right: 12px;
    pointer-events: none;
    color: var(--gold);
    font-size: 11px;
  }

  .back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 8px 14px;
    box-shadow: 0 6px 16px var(--shadow);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
  }
  .back-btn:hover { filter: brightness(1.06); }

  /* RTL-Anpassung für Arabisch, Urdu, Persisch */
  html[dir="rtl"] .lang-picker {
    right: auto;
    left: 20px;
  }
  html[dir="rtl"] .back-btn {
    left: auto;
    right: 20px;
  }

  @media (max-width: 480px) {
    .lang-picker {
      top: 12px;
      right: 12px;
      padding: 6px 10px;
    }
    html[dir="rtl"] .lang-picker {
      left: 12px;
    }
    .back-btn {
      top: 12px;
      left: 12px;
      padding: 6px 10px;
    }
    html[dir="rtl"] .back-btn {
      left: auto;
      right: 12px;
    }
  }

  .irow{display:grid;grid-template-columns:1fr 50px 58px 38px 30px 26px;gap:5px;margin-bottom:6px;}
  .irow input,.irow select{width:100%;min-width:0;background:#0f0c09;border:1px solid #4a3c28;color:var(--parchment);font-family:'EB Garamond',serif;font-size:.95rem;padding:6px;border-radius:3px;}
  .irow input:focus,.irow select:focus{outline:none;border-color:var(--gold);}
  .irow button{background:#0f0c09;border:1px solid #4a3c28;color:var(--parchment);border-radius:3px;cursor:pointer;}
  .irow button:hover{border-color:var(--crimson);color:#d98a8a;}
  .irow-head{display:grid;grid-template-columns:1fr 50px 58px 38px 30px 26px;gap:5px;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-bottom:4px;}
  .equip-group-title{font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-bright);border-top:1px solid var(--gold);padding-top:14px;margin:6px 0 12px;}
  #card{min-height:560px;}
  .seal .num{font-size:1.5rem;}
  .ability-box .label,.story-box .label{margin-bottom:6px;}
  .wares{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .wares li{display:flex;align-items:center;gap:12px;padding:6px 10px 6px 6px;background:var(--slot-bg,rgba(230,190,90,.35));border:2px solid var(--slot-border,#8a7142);border-radius:8px;color:var(--ink);}
  .wares .qs{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--slot-bg-strong,rgba(230,190,90,.5));border:2px solid var(--slot-border,#8a7142);border-radius:6px;font-family:'Cinzel',serif;font-weight:700;font-size:.95rem;color:#5a4a30;}
  .wares .qs.circle{border-radius:50%;}
  .wares .qs.square{border-radius:6px;}
  .wares .qs.belt{width:84px;height:28px;border-radius:5px;font-size:.82rem;}
  .irow select{padding:6px 2px;}
  .irow .sh{display:flex;align-items:center;justify-content:center;padding:0;}
  .irow .sh i{display:block;background:rgba(230,190,90,.5);border:2px solid #8a7142;}
  .irow .sh i.circle{width:16px;height:16px;border-radius:50%;}
  .irow .sh i.square{width:16px;height:16px;border-radius:4px;}
  .irow .sh i.belt{width:22px;height:9px;border-radius:3px;}
  .shape-row{display:flex;gap:12px;align-items:center;}
  .shape-btn{display:flex;align-items:center;justify-content:center;width:84px;height:56px;background:#0f0c09;border:2px solid #4a3c28;border-radius:6px;cursor:pointer;padding:0;}
  .shape-btn:hover{border-color:var(--gold);}
  .shape-btn.active{border-color:var(--gold-bright);box-shadow:0 0 0 2px var(--gold);}
  .shape-btn i{display:block;background:rgba(230,190,90,.5);border:2px solid #8a7142;}
  .shape-btn i.circle{width:36px;height:36px;border-radius:50%;}
  .shape-btn i.square{width:36px;height:36px;border-radius:6px;}
  .shape-btn i.belt{width:66px;height:20px;border-radius:5px;}
  .wares .nm{flex:1;min-width:0;font-size:1.08rem;font-weight:600;overflow-wrap:anywhere;}
  .wares .pr{flex:none;font-family:'Cinzel',serif;font-weight:700;font-size:.95rem;color:var(--crimson);}
  .wares li.empty{justify-content:center;font-style:italic;color:#5a4a30;background:none;border-style:dashed;padding:12px;}
  .story-box p#descOut{font-size:.92rem;}
  .footer-row{justify-content:center;}
</style>
</head>
<body>
<a href="index.html" class="back-btn"><span aria-hidden="true">←</span> <span data-i18n="backToHome">Start</span></a>
<div class="lang-picker"><span class="globe">🌐</span><select id="languageSelect" aria-label="Sprache wählen"></select></div>

<div class="layout">
 <div class="panel">
  <h1 data-i18n="shopHeading">Shop-Generator</h1>
  <p class="sub" data-i18n="shopSubtitle">Erstelle einen eigenen Laden mit Warenliste für deine Kampagne</p>

  <div class="field"><label data-i18n="shopLblName">Name des Ladens</label><input type="text" id="sName" maxlength="40" value="Zum goldenen Amboss"></div>
  <div class="row2">
   <div class="field"><label data-i18n="shopLblKeeper">Händler</label><input type="text" id="sKeeper" maxlength="30" value="Brogar Eisenfaust"></div>
   <div class="field"><label data-i18n="shopLblType">Art des Ladens</label><select id="sType"></select></div>
  </div>
  <div class="field"><label data-i18n="shopLblDesc">Beschreibung</label><textarea id="sDesc" maxlength="300">Waffen und Rüstungen, im Feuer geschmiedet. Handeln erlaubt, Feilschen unerwünscht.</textarea></div>
  <div class="field"><label data-i18n="playerLblAccentColor">Akzentfarbe</label><div class="swatches" id="swatches"></div></div>
  <div class="field"><label class="toggle-row"><input type="checkbox" id="sQty" checked><span class="toggle-switch"></span><span class="toggle-label" data-i18n="shopToggleQty">Anzahl anzeigen</span></label></div>

  <div class="equip-group-title" data-i18n="shopLblWares">Waren</div>
  <div class="irow-head"><span data-i18n="shopColItem">Ware</span><span data-i18n="shopColPrice">Preis</span><span data-i18n="shopColCur">Münze</span><span data-i18n="shopColQty">Anz.</span><span data-i18n="shopColShape">Form</span><span></span></div>
  <div id="items"></div>
  <button class="share-btn" id="addItem" data-i18n="shopAddItem">+ Ware hinzufügen</button>
  <button class="share-btn" id="fillItems" data-i18n="shopFillItems">🎲 Beispielwaren der Ladenart einsetzen</button>

  <button class="export-btn" id="exportBtn" data-i18n="shopExportBtn">Als PNG speichern</button>
  <div class="export-status" id="exportStatus"></div>
 </div>

 <div class="stage">
  <div id="card">
   <div class="seal"><span class="num" id="sealNum">0</span><span class="cap" data-i18n="shopSealCap">Waren</span></div>
   <div class="header">
    <h2 id="nameOut"></h2>
    <div class="epithet" id="keeperOut"></div>
   </div>
   <div class="rule"></div>
   <div class="medallion-row">
    <div class="medallion" id="medallionOut">⚒️</div>
    <div class="ability-box"><div class="label" id="typeOut"></div><p id="descOut"></p></div>
   </div>
   <div class="story-box">
    <div class="label" data-i18n="shopLblOffer">Warenangebot</div>
    <ul class="wares" id="waresOut"></ul>
   </div>
   <div class="footer-row"><span class="brand" id="footOut">1 GM = 10 SM = 100 KM</span></div>
  </div>
 </div>
</div>

<script>
(function(){
const LANGUAGES = window.LANGUAGES || {};
let currentLang = 'de';
function t(key, fb){
  const s = LANGUAGES[currentLang] || {};
  if(s[key] !== undefined) return s[key];
  const e = LANGUAGES.en || {};
  if(currentLang === 'de' || e[key] === undefined) return fb;
  return e[key];
}
// Farben wie in player.html (gleiche Keys playerColor*)
const PALETTE = [
 {name:'Gold',key:'playerColorGold',accent:'#a8823a',bright:'#d9b56a'},
 {name:'Karmesin',key:'playerColorCrimson',accent:'#7c2020',bright:'#b34d4d'},
 {name:'Wald',key:'playerColorForest',accent:'#2f4a2b',bright:'#5c8a52'},
 {name:'Azur',key:'playerColorAzure',accent:'#2a4a66',bright:'#5c8fb3'},
 {name:'Purpur',key:'playerColorPurple',accent:'#4a2a5c',bright:'#7d5399'},
 {name:'Orange',key:'playerColorOrange',accent:'#a8501c',bright:'#e08a4a'},
 {name:'Türkis',key:'playerColorTeal',accent:'#1f6b6b',bright:'#4fb3b0'},
 {name:'Rosa',key:'playerColorRose',accent:'#8a3a5c',bright:'#d17aa0'},
 {name:'Silber',key:'playerColorSilver',accent:'#6b7078',bright:'#b8bec8'},
 {name:'Bronze',key:'playerColorBronze',accent:'#6e4a2a',bright:'#a8794a'},
 {name:'Oliv',key:'playerColorOlive',accent:'#5c6023',bright:'#9aa04a'},
 {name:'Obsidian',key:'playerColorObsidian',accent:'#2b2b33',bright:'#6a6a78'},
 {name:'Indigo',key:'playerColorIndigo',accent:'#2d3a7c',bright:'#6574c4'},
 {name:'Weinrot',key:'playerColorWine',accent:'#5e1a2f',bright:'#a8475f'},
 {name:'Smaragd',key:'playerColorEmerald',accent:'#1d5c45',bright:'#3fae83'},
 {name:'Königsblau',key:'playerColorRoyal',accent:'#1c3f94',bright:'#4f7be0'},
 {name:'Kupfer',key:'playerColorCopper',accent:'#8a4a2e',bright:'#d98560'},
 {name:'Ocker',key:'playerColorOchre',accent:'#8a6a12',bright:'#d6b23c'},
 {name:'Flieder',key:'playerColorLilac',accent:'#6a5a8e',bright:'#a899d1'},
 {name:'Petrol',key:'playerColorPetrol',accent:'#17505c',bright:'#3d9db0'},
 {name:'Kastanie',key:'playerColorChestnut',accent:'#5a2e1a',bright:'#94593a'},
 {name:'Schiefer',key:'playerColorSlate',accent:'#3a4a5a',bright:'#7a93ad'},
 {name:'Magenta',key:'playerColorMagenta',accent:'#8a1f6a',bright:'#d65aa8'},
 {name:'Scharlach',key:'playerColorScarlet',accent:'#b02a1c',bright:'#e8604d'}
];
let selectedPalette = PALETTE[1];
// Ladenarten: nur ans ENDE anhängen. Beispielwaren: [Name, Preis, Münze 0=GM 1=SM 2=KM, Anzahl]
const TYPES = [
 {id:'smith',icon:'⚒️',de:'Schmiede',items:[['Langschwert',15,0,3],['Kurzschwert',10,0,4],['Kettenhemd',75,0,1],['Holzschild',10,1,6],['Dolch',2,0,8]]},
 {id:'alchemist',icon:'⚗️',de:'Alchemist',items:[['Heiltrank',50,0,5],['Gegengift',25,0,3],['Säureflasche',25,0,4],['Nachtsichttrank',120,0,1]]},
 {id:'general',icon:'🧺',de:'Gemischtwaren',items:[['Seil (15 m)',1,0,10],['Fackel',1,2,30],['Proviant (1 Tag)',5,1,20],['Rucksack',2,0,5],['Zelt',2,0,3]]},
 {id:'magic',icon:'🔮',de:'Magieladen',items:[['Zauberstab',300,0,2],['Schriftrolle',75,0,6],['Umhang des Schutzes',500,0,1],['Kristallkugel',900,0,1]]},
 {id:'tavern',icon:'🍺',de:'Taverne',items:[['Krug Bier',4,2,50],['Eintopf',3,1,15],['Zimmer (Nacht)',5,1,6],['Starker Met',2,1,12]]},
 {id:'bakery',icon:'🥖',de:'Bäckerei',items:[['Brotlaib',2,2,25],['Honigkuchen',5,2,12],['Apfeltasche',3,2,16]]}
];
const CUR = ['GM','SM','KM'];
// Feldformen wie die Ausrüstungsslots in player.html (nur ans ENDE anhängen)
const SHAPES = [{id:'circle',de:'Kreis'},{id:'square',de:'Quadrat'},{id:'belt',de:'Gürtel'}];
const MAXITEMS = 20;
const $ = id => document.getElementById(id);

const itemsBox = $('items');

function hexToRgb(hex){const m=hex.replace('#','').match(/.{1,2}/g);return{r:parseInt(m[0],16),g:parseInt(m[1],16),b:parseInt(m[2],16)};}
function mixHex(a,b,ra){const x=hexToRgb(a),y=hexToRgb(b);return 'rgb('+Math.round(x.r*ra+y.r*(1-ra))+','+Math.round(x.g*ra+y.g*(1-ra))+','+Math.round(x.b*ra+y.b*(1-ra))+')';}
function mixWithAlpha(hex,al){const c=hexToRgb(hex);return 'rgba('+c.r+','+c.g+','+c.b+','+al+')';}

// Swatches: Anzeige nach Farbton sortiert wie in player.html
function hueKey(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0;
  if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
  const sat=d?d/(1-Math.abs(2*l-1)):0;return{h,l,neutral:sat<0.2};
}
const order=PALETTE.map((p,i)=>({i,k:hueKey(p.accent)})).sort((a,b)=>{
  if(a.k.neutral!==b.k.neutral)return a.k.neutral?1:-1;
  if(a.k.neutral)return a.k.l-b.k.l;
  return a.k.h-b.k.h||a.k.l-b.k.l;}).map(o=>o.i);
order.forEach(i=>{
  const p=PALETTE[i],div=document.createElement('div');
  div.dataset.idx=i;div.className='swatch'+(p===selectedPalette?' active':'');
  div.style.background='radial-gradient(circle at 35% 30%, '+p.bright+', '+p.accent+' 75%)';
  div.title=p.name;
  div.addEventListener('click',()=>{selectedPalette=p;document.querySelectorAll('.swatch').forEach(e=>e.classList.remove('active'));div.classList.add('active');render();});
  $('swatches').appendChild(div);
});

function fillTypes(){
  const sel=$('sType');const v=sel.value;sel.innerHTML='';
  TYPES.forEach((ty,i)=>{const o=document.createElement('option');o.value=i;o.textContent=ty.icon+' '+t('shopType_'+ty.id,ty.de);sel.appendChild(o);});
  sel.value=v||0;
}
function setShape(r,id){
  r.dataset.shape=id;const i=r.querySelector('.sh i');i.className=id;
  const sh=SHAPES.find(x=>x.id===id);r.querySelector('.sh').title=t('shopShape_'+id,sh.de);
}
function addRow(name,price,cur,qty,shp){
  if(itemsBox.children.length>=MAXITEMS)return;
  const r=document.createElement('div');r.className='irow';
  r.innerHTML='<input type="text" class="in" maxlength="32"><input type="number" class="ip" min="0" max="99999"><select class="ic"></select><input type="number" class="iq" min="0" max="99"><button type="button" class="sh"><i></i></button><button type="button" class="rm">✕</button>';
  CUR.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c;r.querySelector('.ic').appendChild(o);});
  r.querySelector('.in').value=name||'';r.querySelector('.ip').value=price===undefined?'':price;
  r.querySelector('.ic').value=cur||0;r.querySelector('.iq').value=qty===undefined?'':qty;
  setShape(r,shp||'square');
  r.querySelector('.sh').onclick=()=>{const k=SHAPES.findIndex(x=>x.id===r.dataset.shape);setShape(r,SHAPES[(k+1)%SHAPES.length].id);render();};
  r.querySelector('.rm').onclick=()=>{r.remove();render();};
  r.addEventListener('input',render);r.addEventListener('change',render);
  itemsBox.appendChild(r);
}
function fillExamples(){
  itemsBox.innerHTML='';
  const ty=TYPES[Number($('sType').value)||0];
  ty.items.forEach((it,i)=>addRow(t('shopItem_'+ty.id+'_'+i,it[0]),it[1],it[2],it[3]));
  render();
}
function render(){
  const ty=TYPES[Number($('sType').value)||0];
  const P=selectedPalette,card=$('card'),bd='#0a0806',bs=document.body.style;
  card.style.setProperty('--accent',P.accent);card.style.setProperty('--accent-bright',P.bright);
  bs.setProperty('--accent',P.accent);bs.setProperty('--accent-bright',P.bright);
  bs.setProperty('--bg-base',mixHex(P.accent,bd,0.10));
  bs.setProperty('--bg-glow-1',mixHex(P.bright,bd,0.22));
  bs.setProperty('--bg-glow-2',mixHex(P.accent,bd,0.20));
  bs.setProperty('--bg-spot',mixWithAlpha(P.bright,0.12));
  // keine color-mix()-Werte, html2canvas kann sie nicht lesen
  card.style.setProperty('--accent-mix-20-transparent',mixWithAlpha(P.accent,0.2));
  card.style.setProperty('--accent-mix-60-black',mixHex(P.accent,'#000000',0.6));
  card.style.setProperty('--accent-mix-55-transparent',mixWithAlpha(P.accent,0.55));
  card.style.setProperty('--slot-bg',mixWithAlpha(P.bright,0.35));
  card.style.setProperty('--slot-bg-strong',mixWithAlpha(P.bright,0.5));
  card.style.setProperty('--slot-border',mixHex(P.accent,'#8a7142',0.45));
  card.style.setProperty('--card-tint-1',mixHex(P.accent,'#e7d9b6',0.14));
  card.style.setProperty('--card-tint-2',mixHex(P.accent,'#ded0a6',0.16));
  card.style.setProperty('--card-tint-3',mixHex(P.accent,'#d3c092',0.18));
  document.documentElement.style.setProperty('--accent',P.accent);

  $('medallionOut').textContent=ty.icon;
  $('nameOut').textContent=$('sName').value||t('shopDefaultName','Mein Laden');
  const k=$('sKeeper').value.trim();
  $('keeperOut').textContent=k?t('shopKeeperPrefix','Händler:')+' '+k:'';
  $('typeOut').textContent=t('shopType_'+ty.id,ty.de);
  $('descOut').textContent=$('sDesc').value;
  const ul=$('waresOut');ul.innerHTML='';let n=0;const showQty=$('sQty').checked;
  itemsBox.querySelectorAll('.irow').forEach(r=>{
    const nm=r.querySelector('.in').value.trim();if(!nm)return;n++;
    const p=r.querySelector('.ip').value,q=r.querySelector('.iq').value;
    const li=document.createElement('li');
    const q0=document.createElement('span');q0.className='qs '+(r.dataset.shape||'square');q0.textContent=(showQty&&q!=='')?'×'+q:ty.icon;li.appendChild(q0);
    const a=document.createElement('span');a.className='nm';a.textContent=nm;li.appendChild(a);
    const c=document.createElement('span');c.className='pr';
    c.textContent=p===''?'–':p+' '+CUR[Number(r.querySelector('.ic').value)||0];
    li.appendChild(c);ul.appendChild(li);
  });
  if(!n){const e=document.createElement('li');e.className='empty';e.textContent=t('shopEmpty','Keine Waren im Angebot.');ul.appendChild(e);}
  $('sealNum').textContent=n;
  $('footOut').textContent=t('shopFoot','1 GM = 10 SM = 100 KM');
}
function applyLanguage(lang){
  currentLang=LANGUAGES[lang]?lang:(LANGUAGES.en?'en':'de');
  const s=LANGUAGES[currentLang]||{};
  document.documentElement.lang=currentLang;document.documentElement.dir=s.dir||'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');const val=s[key]!==undefined?s[key]:(LANGUAGES.en||{})[key];
    if(val!==undefined)el.textContent=val;});
  document.querySelectorAll('#swatches .swatch').forEach(el=>{
    const key=PALETTE[Number(el.dataset.idx)].key;const val=s[key]!==undefined?s[key]:(LANGUAGES.en||{})[key];
    if(val!==undefined)el.title=val;});
  document.title=t('shopHeading','Shop-Generator');
  const sel=$('languageSelect');if(sel.options.length)sel.value=currentLang;
  fillTypes();render();
}
function detectLanguage(){
  const sup=Object.keys(LANGUAGES);
  const bl=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];
  for(const l of bl){const c=l.toLowerCase().split('-')[0];if(sup.includes(c))return c;}
  return LANGUAGES.en?'en':'de';
}
const sel=$('languageSelect');
Object.keys(LANGUAGES).forEach(code=>{const o=document.createElement('option');o.value=code;o.textContent=LANGUAGES[code].nativeName||code;sel.appendChild(o);});
sel.addEventListener('change',function(){applyLanguage(this.value);});
['sName','sKeeper','sDesc'].forEach(id=>$(id).addEventListener('input',render));
$('sType').addEventListener('change',render);$('sQty').addEventListener('change',render);
$('addItem').onclick=()=>{addRow('','',0,'');render();};
$('fillItems').onclick=fillExamples;
$('exportBtn').onclick=function(){
  const st=$('exportStatus');
  if(typeof html2canvas==='undefined'){console.error('html2canvas fehlt');return;}
  html2canvas($('card'),{backgroundColor:null,scale:2,useCORS:true}).then(cv=>{
    const a=document.createElement('a');
    a.download=(($('sName').value||'shop').replace(/[^\w\-]+/g,'_'))+'.png';
    a.href=cv.toDataURL('image/png');a.click();st.textContent='';
  }).catch(e=>{console.error(e);});
};
fillTypes();fillExamples();applyLanguage(detectLanguage());
})();
</script>
</body>
</html>
